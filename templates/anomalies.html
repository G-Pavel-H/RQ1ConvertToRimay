<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit anomalies</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1d21;--muted:#6b717b;--line:#e3e6ea;--soft:#f0f2f5;--accent:#2a78d6;--accent-soft:#e6f0fc;
  --ok:#1e7a3c;--ok-soft:#e5f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;--warn:#9a5b00;--warn-soft:#fdf1dc;
  --m-haiku:#2a78d6;--m-sonnet:#eb6834;--m-opus:#1baf7a;--block:#eaf3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1113;--panel:#171a1d;--ink:#e7e9ec;--muted:#9aa1aa;--line:#2a2e33;--soft:#1f2327;--accent:#6aa6ef;--accent-soft:#1b2a3d;
  --ok:#5cc47e;--ok-soft:#15301e;--bad:#ef8a83;--bad-soft:#3a1a17;--warn:#e0a54a;--warn-soft:#33270f;
  --m-haiku:#3987e5;--m-sonnet:#d95926;--m-opus:#199e70;--block:#16281a}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header h1{font-size:15px;margin:0}
.fg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.fg>span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.fb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:1px 8px;font-size:12px}
.fb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
select,input{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel);color:var(--ink)}
#wrap{flex:1;display:flex;min-height:0}
#list{width:330px;flex:none;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
#main{flex:1;overflow-y:auto;padding:16px 22px 60px;min-width:0}
.li{display:block;padding:7px 12px;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.li:hover{background:var(--soft);text-decoration:none}.li.on{background:var(--accent-soft)}
.li .top{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:12.5px}
.strip{display:flex;gap:2px;margin-top:4px}
.strip i{font-style:normal;width:24px;text-align:center;font-size:10.5px;border-radius:3px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--soft)}
.strip i.over{background:var(--warn-soft);color:var(--warn);font-weight:700}.strip i.under{background:var(--bad-soft);color:var(--bad);font-weight:700}
.strip i.fmt{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.strip i.off{opacity:.25}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{font-size:13.5px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2{font-size:19px;margin:0 0 2px}.hint{font-size:12px;color:var(--muted)}
.mono{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.fmt{background:var(--accent-soft);color:var(--accent)}.tag.reqd{background:var(--bad-soft);color:var(--bad)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0}
.sl{display:inline-flex;gap:3px;flex-wrap:wrap}
.sl b{font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.sl b.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}.sl b.impl{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
tr.gap td{background:var(--bad-soft)}tr.extra td{background:var(--warn-soft)}
.raw{background:var(--soft);border-radius:6px;padding:8px 10px;max-height:460px;overflow:auto}
.raw .blk{background:var(--block);display:block;border-left:3px solid var(--ok);padding-left:6px}
.raw .drop{background:var(--bad-soft);text-decoration:line-through}
.raw .pre{color:var(--muted)}
.kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--soft)}
.sum td.c{text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}.sum td.c:hover{outline:1px solid var(--accent)}
.sum td.z{color:var(--muted);opacity:.5}
details>summary{cursor:pointer}
@media (max-width:800px){#wrap{flex-direction:column}#list{width:auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Unit anomalies</h1>
  <div class="fg" id="fModel"><span>Model</span></div>
  <div class="fg" id="fStrat"><span>Strategy</span></div>
  <div class="fg"><span>Show</span><select id="fShow"></select></div>
  <div class="fg"><input id="fQ" placeholder="Search id or text" size="16"></div>
  <span class="hint"><span class="kbd">j</span>/<span class="kbd">k</span> next / previous · <a href="#/">summary</a> · <a href="dashboard.html">dashboard</a></span>
</header>
<div id="wrap"><nav id="list"></nav><main id="main"></main></div>
<script>
const D = __ANOMALY_DATA__;
const MODELS = ["haiku", "sonnet", "opus"], STRATS = ["zsl", "fsl", "cot"];
const SLOTS = ["scope", "condition", "actor", "modalVerb", "action"], REQD = new Set(["actor", "modalVerb", "action"]);
const SL = {scope: "scope", condition: "condition", actor: "actor", modalVerb: "modal verb", action: "action"};
const ML = {haiku: "Haiku", sonnet: "Sonnet", opus: "Opus"};
const COUNT_KINDS = new Set(["split_atomic", "merged_non_atomic", "count_mismatch"]);
const KINDS = Object.assign({}, ...D.runs.map(r => r.kinds));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const f2 = v => v == null ? "—" : (+v).toFixed(2);
const sw = m => `<span class="sw" style="background:var(--m-${m})"></span>`;
const runName = k => { const [m, s] = k.split("/"); return `${ML[m]} ${s}`; };
const ids = Object.keys(D.reqs);
const st = {models: new Set(MODELS), strats: new Set(STRATS), show: "count", q: ""};
try { Object.assign(st, (j => ({show: j.show || "count"}))(JSON.parse(localStorage.getItem("anomView") || "{}"))); } catch (e) {}
const runs = () => D.runs.filter(r => st.models.has(r.model) && st.strats.has(r.strat));
const cell = (id, k) => (D.cells[id] || {})[k];
const fmtIssue = c => c.anomalies.some(a => !COUNT_KINDS.has(a.kind));
const offCount = c => c.returned !== c.expected;

// ---------- filters ----------
const SHOW = [["count", "Unit count off the gold"], ["any", "Any anomaly"], ["format", "Format anomalies"], ["merged", "Gold units left unmatched"],
  ["nonatomic", "Non-atomic requirements"], ["all", "All requirements"]];
function keep(id) {
  const g = D.reqs[id], cs = runs().map(r => cell(id, r.key)).filter(Boolean);
  const hit = {count: cs.some(offCount), any: cs.some(c => c.anomalies.length), format: cs.some(fmtIssue),
    merged: cs.some(c => c.missing.length), nonatomic: g.units.length > 1, all: true}[st.show];
  return hit && (!st.q || (id + " " + g.nl).toLowerCase().includes(st.q));
}
const severity = id => runs().reduce((s, r) => { const c = cell(id, r.key); return s + (c ? (offCount(c) ? 2 : 0) + c.anomalies.length : 0); }, 0);
const visible = () => ids.filter(keep).sort((a, b) => severity(b) - severity(a) || a.localeCompare(b));

function drawFilters() {
  const chips = (host, all, set, lab) => { $(host).querySelectorAll("button").forEach(b => b.remove());
    all.forEach(v => { const b = document.createElement("button"); b.className = "fb" + (set.has(v) ? " on" : ""); b.innerHTML = lab(v);
      b.onclick = e => { if (e.altKey || e.metaKey) { set.clear(); set.add(v); } else if (set.has(v) && set.size > 1) set.delete(v); else set.add(v); render(); };
      b.title = "Click to toggle; ⌥/⌘-click to show only this"; $(host).appendChild(b); }); };
  chips("#fModel", MODELS, st.models, m => `${sw(m)} ${ML[m]}`);
  chips("#fStrat", STRATS, st.strats, s => s);
  $("#fShow").innerHTML = SHOW.map(([k, l]) => `<option value="${k}" ${st.show === k ? "selected" : ""}>${l}</option>`).join("");
}
$("#fShow").onchange = e => { st.show = e.target.value; try { localStorage.setItem("anomView", JSON.stringify({show: st.show})); } catch (_) {} render(); };
$("#fQ").oninput = e => { st.q = e.target.value.toLowerCase().trim(); render(); };

// ---------- list ----------
function strip(id) {
  return `<div class="strip">${D.runs.map(r => { const c = cell(id, r.key); if (!c) return `<i class="off">·</i>`;
    const on = st.models.has(r.model) && st.strats.has(r.strat);
    const cls = [c.returned > c.expected ? "over" : c.returned < c.expected ? "under" : "", fmtIssue(c) ? "fmt" : "", on ? "" : "off"].join(" ");
    return `<i class="${cls}" title="${esc(runName(r.key))}: ${c.returned} of ${c.expected}${c.anomalies.length ? " · " + c.anomalies.map(a => a.kind.replace(/_/g, " ")).join(", ") : ""}">${c.returned}</i>`; }).join("")}</div>`;
}
function drawList(cur) {
  const v = visible();
  $("#list").innerHTML = `<div class="li" style="cursor:default"><span class="hint">${v.length} of ${ids.length} requirements · cells: units returned per run
    (${MODELS.map(m => ML[m][0]).join("/")} × zsl·fsl·cot). <span style="color:var(--warn)">amber</span> more than gold, <span style="color:var(--bad)">red</span> fewer, blue outline = format anomaly.</span></div>`
    + v.map(id => { const g = D.reqs[id];
      return `<a class="li ${id === cur ? "on" : ""}" href="#/${encodeURIComponent(id)}"><div class="top"><span>${esc(id)}</span>
        <span class="tag ${g.units.length > 1 ? "warn" : ""}">${g.units.length > 1 ? `non-atomic · ${g.units.length}` : "atomic"}</span></div>
        <div class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.nl)}</div>${strip(id)}</a>`; }).join("");
  const on = $("#list .li.on"); if (on) on.scrollIntoView({block: "nearest"});
}

// ---------- summary ----------
function viewSummary() {
  const rs = runs(), kinds = Object.keys(KINDS).filter(k => rs.some(r => r.counts[k]));
  const n = (r, k) => r.counts[k] || 0;
  const offReq = r => ids.filter(id => { const c = cell(id, r.key); return c && offCount(c); }).length;
  const unm = r => ids.reduce((s, id) => { const c = cell(id, r.key); return s + (c ? c.missing.length : 0); }, 0);
  const goldU = ids.reduce((s, id) => s + D.reqs[id].units.length, 0);
  return `<h2>Experiment ${D.exp} — unit anomalies</h2>
    <p class="hint" style="max-width:900px">Every requirement across the ${D.runs.length} runs, built from the saved replies (nothing re-run).
      ${ids.length} requirements, ${goldU} gold units. Pick a requirement on the left, or click a number below to filter.
      A gold unit is <b>unmatched</b> when no model line was aligned to it — usually because the model merged it into another line or split the requirement differently, not because the content is absent.</p>
    <div class="card" style="overflow-x:auto"><h3>Per run</h3><table class="sum">
      <tr><th>Run</th><th class="n">units / gold</th><th class="n">requirements off-count</th><th class="n">gold units unmatched</th>
        ${kinds.map(k => `<th class="n" title="${esc(KINDS[k])}">${esc(k.replace(/_/g, " "))}</th>`).join("")}</tr>
      ${rs.map(r => { const ret = ids.reduce((s, id) => s + (cell(id, r.key) || {returned: 0}).returned, 0);
        return `<tr><td>${sw(r.model)} ${esc(runName(r.key))}</td><td class="n">${ret} / ${goldU}</td>
          <td class="c" data-only="${r.key}" data-show="count">${offReq(r)}</td><td class="c" data-only="${r.key}" data-show="merged">${unm(r)}</td>
          ${kinds.map(k => `<td class="c ${n(r, k) ? "" : "z"}" data-only="${r.key}" data-show="${COUNT_KINDS.has(k) ? "count" : "format"}">${n(r, k) || "·"}</td>`).join("")}</tr>`; }).join("")}
    </table><p class="hint" style="margin:6px 0 0">Click a cell to show only that run. Hover a header for its meaning.</p></div>
    <div class="card"><h3>What each anomaly means</h3><table style="width:auto">${Object.entries(KINDS).map(([k, v]) =>
      `<tr><td><span class="tag ${COUNT_KINDS.has(k) ? "warn" : "fmt"}">${esc(k.replace(/_/g, " "))}</span></td><td class="hint">${esc(v)}</td></tr>`).join("")}</table></div>`;
}
document.addEventListener("click", e => { const t = e.target.closest("td[data-only]"); if (!t) return;
  const [m, s] = t.dataset.only.split("/"); st.models = new Set([m]); st.strats = new Set([s]); st.show = t.dataset.show;
  const v = (render(), visible()); if (v.length) location.hash = "#/" + encodeURIComponent(v[0]); });

// ---------- requirement ----------
const words = s => new Set(String(s).toLowerCase().replace(/<missing_[a-z_]+>/g, " ").match(/[a-z0-9]+/g) || []);
const STOP = new Set("the a an to of and or for if then must shall should will be is in on by with from app signal system user it that this as when".split(" "));
function overlap(goldTexts, line) { const g = new Set([...goldTexts.flatMap(t => [...words(t)])].filter(w => !STOP.has(w))), l = [...words(line)].filter(w => !STOP.has(w));
  if (!g.size) return 0; return l.filter(w => g.has(w)).length / g.size; }
const goldSlots = s => `<span class="sl">${SLOTS.map(k => `<b class="${s[k] === "missing" ? "miss" : s[k] === "implied" ? "impl" : ""}" title="${SL[k]}: ${esc(s[k])}${REQD.has(k) ? " (required)" : " (optional)"}">${SL[k]}${REQD.has(k) ? "*" : ""}</b>`).join("")}</span>`;
const llmSlots = s => `<span class="sl">${SLOTS.map(k => `<b class="${s[k] === "missing" ? "miss" : ""}" title="${SL[k]}: ${esc(s[k])}">${SL[k]}${REQD.has(k) ? "*" : ""}</b>`).join("")}</span>`;

function rawHtml(c) {
  const raw = c.raw || "", dropped = new Set((c.format.dropped || []).map(x => x.trim()));
  if (!raw) return `<p class="hint">No reply saved.</p>`;
  const i = raw.lastIndexOf("<rimay>"), j = raw.indexOf("</rimay>", i);
  const mark = t => esc(t).split("\n").map(l => dropped.has(l.trim()) ? `<span class="drop">${l}</span>` : l).join("\n");
  if (i < 0) return `<div class="raw mono">${mark(raw)}</div>`;
  const end = j < 0 ? raw.length : j + 8;
  return `<div class="raw mono"><span class="pre">${esc(raw.slice(0, i))}</span><span class="blk">${mark(raw.slice(i, end))}</span>${esc(raw.slice(end))}</div>`;
}

function runCard(id, r) {
  const c = cell(id, r.key), g = D.reqs[id]; if (!c) return "";
  const usedBy = {}; Object.entries(c.mapping).forEach(([k, j]) => { if (j != null) usedBy[j] = +k; });
  const rows = g.units.map((u, i) => { const k = i + 1, j = c.mapping[k];
    if (j != null) { const m = c.units[j - 1] || {};
      return `<tr><td class="n">${k}</td><td class="mono">${esc(u.humans[0] || "")}</td><td class="n">${j}</td>
        <td class="mono">${esc(m.rimay)}<div style="margin-top:3px">${llmSlots(m.slots || {})} ${m.paska === false ? `<span class="tag bad" title="${esc((m.smells || []).join(", "))}">Paska fail</span>` : ""}</div></td><td class="n">${f2(c.cos[k])}</td></tr>`; }
    const best = c.units.map((m, jj) => ({jj: jj + 1, o: overlap(u.humans, m.rimay)})).sort((a, b) => b.o - a.o)[0];
    const where = best && best.o >= .35 ? `Closest model line: <b>#${best.jj}</b> (${Math.round(best.o * 100)}% of the gold unit's content words)${usedBy[best.jj] ? `, already aligned to gold #${usedBy[best.jj]} — likely <b>merged</b>` : ""}.`
      : `No model line shares most of its content — likely <b>dropped</b>.`;
    return `<tr class="gap"><td class="n">${k}</td><td class="mono">${esc(u.humans[0] || "")}</td><td class="n">—</td><td colspan="2"><b>Unmatched.</b> ${where}</td></tr>`; }).join("");
  const extras = c.units.map((m, jj) => ({m, j: jj + 1})).filter(x => !usedBy[x.j]).map(x =>
    `<tr class="extra"><td class="n">—</td><td class="hint">no gold unit — extra line</td><td class="n">${x.j}</td><td class="mono" colspan="2">${esc(x.m.rimay)}<div style="margin-top:3px">${llmSlots(x.m.slots || {})}</div></td></tr>`).join("");
  const f = c.format, bad = offCount(c) || c.anomalies.length;
  return `<div class="card" id="r-${r.key.replace("/", "-")}"><h3>${sw(r.model)} ${esc(runName(r.key))}
      <span class="tag ${c.returned === c.expected ? "ok" : c.returned > c.expected ? "warn" : "bad"}">${c.returned} of ${c.expected} units</span>
      ${c.anomalies.map(a => `<span class="tag ${COUNT_KINDS.has(a.kind) ? "warn" : "fmt"}" title="${esc(KINDS[a.kind] || "")}${a.detail ? " — " + esc(a.detail) : ""}">${esc(a.kind.replace(/_/g, " "))}</span>`).join("")}</h3>
    <div style="overflow-x:auto"><table><tr><th class="n">gold</th><th>Gold unit (annotator 1)</th><th class="n">model</th><th>Model line</th><th class="n">cosine</th></tr>${rows}${extras}</table></div>
    <details ${bad ? "open" : ""} style="margin-top:8px"><summary class="hint">Full reply · stop ${esc(c.stop || "—")} · ${c.outTok ?? "—"} output tokens · ${c.latency != null ? (c.latency / 1000).toFixed(1) + " s" : "—"}
      · block ${f.block ? (f.closed ? "closed" : "<b>unclosed</b>") : "<b>none</b>"} · ${f.before || 0} chars before, ${f.outside || 0} after${(f.dropped || []).length ? ` · ${f.dropped.length} dropped lines` : ""}</summary>
      <div style="margin-top:6px">${rawHtml(c)}</div>
      <p class="hint" style="margin:4px 0 0">Green = the parsed <code>&lt;rimay&gt;</code> block; grey = text before it; struck red = lines removed by the Rimay-line filter.</p></details></div>`;
}

function viewReq(id) {
  const g = D.reqs[id]; if (!g) return `<div class="card">Unknown requirement ${esc(id)}.</div>`;
  const v = visible(), i = v.indexOf(id);
  const nav = `<span class="hint">${i >= 0 ? `${i + 1} of ${v.length}` : "not in the current filter"}
    ${i > 0 ? ` · <a href="#/${encodeURIComponent(v[i - 1])}">← ${esc(v[i - 1])}</a>` : ""}${i >= 0 && i < v.length - 1 ? ` · <a href="#/${encodeURIComponent(v[i + 1])}">${esc(v[i + 1])} →</a>` : ""}</span>`;
  const rs = runs();
  return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>${esc(id)}
      <span class="tag ${g.units.length > 1 ? "warn" : ""}">${g.units.length > 1 ? `non-atomic · ${g.units.length} gold units` : "atomic · 1 gold unit"}</span></h2>${nav}</div>
    <div class="card" style="margin-top:8px"><h3>Source</h3><div class="mono">${esc(g.nl)}</div></div>
    <details class="card"><summary><b>Gold units</b> <span class="hint">— all three annotators; slots: <span class="sl"><b class="miss">missing</b><b class="impl">implied</b><b>present</b></span>, * = required by the Rimay grammar</span></summary>
      <table style="margin-top:6px"><tr><th class="n">#</th><th>Annotators' Rimay</th><th>Gold slots</th></tr>
      ${g.units.map((u, k) => `<tr><td class="n">${k + 1}</td><td>${u.humans.map(h => `<div class="mono">• ${esc(h)}</div>`).join("")}</td><td>${goldSlots(u.slots)}</td></tr>`).join("")}</table></details>
    <div class="card"><h3>Units returned per run</h3><table style="width:auto"><tr><th></th>${STRATS.map(s => `<th class="n">${s}</th>`).join("")}</tr>
      ${MODELS.map(m => `<tr><td>${sw(m)} ${ML[m]}</td>${STRATS.map(s => { const c = cell(id, `${m}/${s}`); if (!c) return `<td class="n hint">·</td>`;
        const col = c.returned > c.expected ? "var(--warn)" : c.returned < c.expected ? "var(--bad)" : "var(--muted)";
        return `<td class="n"><a href="#r-${m}-${s}" style="color:${col};font-weight:${c.returned === c.expected ? 400 : 700}" onclick="event.preventDefault();document.getElementById('r-${m}-${s}')?.scrollIntoView({behavior:'smooth'})">${c.returned}</a></td>`; }).join("")}</tr>`).join("")}
    </table><p class="hint" style="margin:4px 0 0">Gold: ${g.units.length}. Click a number to jump to that run.</p></div>
    ${rs.map(r => runCard(id, r)).join("") || `<p class="hint">No run matches the model / strategy filter.</p>`}`;
}

// ---------- routing ----------
function render() {
  drawFilters();
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const real = D.reqs[id] ? id : "";
  drawList(real);
  $("#main").innerHTML = real ? viewReq(real) : viewSummary();
  document.title = real ? `${real} · unit anomalies` : "Unit anomalies";
}
window.addEventListener("hashchange", () => { render(); $("#main").scrollTop = 0; });
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey) return;
  const v = visible(), id = decodeURIComponent(location.hash.replace(/^#\/?/, "")), i = v.indexOf(id);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); const n = v[Math.min(v.length - 1, i + 1)]; if (n) location.hash = "#/" + encodeURIComponent(n); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); const n = v[Math.max(0, i - 1)]; if (n) location.hash = "#/" + encodeURIComponent(n); }
  if (e.key === "Escape") location.hash = "#/";
});
$("#ttl").textContent = `Experiment ${D.exp} · unit anomalies`;
render();
</script>
</body>
</html>
