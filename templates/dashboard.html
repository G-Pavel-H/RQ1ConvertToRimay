<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimay experiments</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1d21;--muted:#6b717b;--line:#e3e6ea;--soft:#f0f2f5;--accent:#2a78d6;--accent-soft:#e6f0fc;
  --ok:#1e7a3c;--ok-soft:#e5f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;--warn:#9a5b00;--warn-soft:#fdf1dc;
  /* models: categorical slots 1–3, validated all-pairs on #fff */
  --m-haiku:#2a78d6;--m-sonnet:#eb6834;--m-opus:#1baf7a;--m-other:#8a8f98;
  /* magnitude: one hue */
  --heat:#2a78d6;--track:#cde2fb;--bar:#2a78d6;
  /* score bands (good / moderate / poor); checked for ink contrast and CVD separation, arrows as second cue */
  --q-good:#a8dcc6;--q-mid:#fbe08a;--q-low:#f4a68c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1113;--panel:#171a1d;--ink:#e7e9ec;--muted:#9aa1aa;--line:#2a2e33;--soft:#1f2327;--accent:#6aa6ef;--accent-soft:#1b2a3d;
  --ok:#5cc47e;--ok-soft:#15301e;--bad:#ef8a83;--bad-soft:#3a1a17;--warn:#e0a54a;--warn-soft:#33270f;
  --m-haiku:#3987e5;--m-sonnet:#d95926;--m-opus:#199e70;--m-other:#7d838c;
  --heat:#3987e5;--track:#184f95;--bar:#3987e5;
  --q-good:#14614a;--q-mid:#7a6212;--q-low:#7a2c18}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:0 4px;border-radius:4px}
#side{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 10px}
#side h1{font-size:15px;margin:0 6px 2px}
#side .sub{font-size:11.5px;color:var(--muted);margin:0 6px 12px}
#side .grp{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 6px 4px}
#side a{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;color:var(--ink);font-size:13px}
#side a:hover{background:var(--soft);text-decoration:none}
#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#side a.l2{padding-left:18px}#side a.l3{padding-left:34px;font-size:12.5px}
#side a.off{color:var(--muted)}
#side details summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 8px}
#main{flex:1;overflow-y:auto;padding:20px 26px 60px;min-width:0}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:4px}
h2{font-size:20px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 16px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card>h3{font-size:13.5px;margin:0 0 4px}
.card>.hint:first-of-type{margin-top:0}
.hint{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;align-items:start}
.cols>.card{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.tile span{font-size:11.5px;color:var(--muted)}
.tile small{display:block;font-size:11px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sep td{border-top:2px solid var(--line)}
td.hm{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.best{font-weight:700}
td.q-good,.mx td.c.q-good{background:var(--q-good)}td.q-mid,.mx td.c.q-mid{background:var(--q-mid)}td.q-low,.mx td.c.q-low{background:var(--q-low)}
td.hm.q-good::after,.tile.q-good b::after{content:"↑";font-size:.75em;margin-left:3px;opacity:.7}
td.hm.q-low::after,.tile.q-low b::after{content:"↓";font-size:.75em;margin-left:3px;opacity:.7}
.tile.q-good{border-left:4px solid var(--q-good)}.tile.q-mid{border-left:4px solid var(--q-mid)}.tile.q-low{border-left:4px solid var(--q-low)}
.qkey{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}
td.na{color:var(--muted);text-align:right}
.over{color:var(--warn);font-weight:600}.under{color:var(--bad);font-weight:600}td.over{background:var(--warn-soft)}td.under{background:var(--bad-soft)}
ul.anl{margin:6px 0;padding-left:18px;font-size:13px}ul.anl li{margin:2px 0}details.anr{margin-top:6px}details.anr summary{cursor:pointer;font-size:13px}
.scroll{overflow-x:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:-1px}
.mname{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.reqd{background:var(--bad-soft);color:var(--bad)}
.tag.inc{background:var(--warn-soft);color:var(--warn)}
.chip{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.mono{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
/* charts — positions on a fixed 0–1 scale */
.cg{display:grid;column-gap:12px;row-gap:3px;align-items:center}
.cg.dots{grid-template-columns:minmax(110px,max-content) minmax(140px,1fr)}
.cg.box{grid-template-columns:minmax(150px,max-content) minmax(160px,1fr) 52px}
.plot{position:relative;height:30px}
.plot .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.plot .ref{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--muted)}
.plot .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.plot .hit{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%}
.plot .whisk{position:absolute;top:50%;height:1px;background:var(--muted)}
.plot .box{position:absolute;top:7px;bottom:7px;background:var(--track);border-radius:3px}
.plot .med{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:var(--ink)}
.plot .sdot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;opacity:.8}
.axis{position:relative;height:16px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;transform:translateX(-50%)}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px 22px}
.panel h4{font-size:12.5px;margin:0 0 2px}
.panel .hint{margin:0 0 6px}
/* requirement matrix */
.mx{border-collapse:separate;border-spacing:2px;width:auto}
.mx td,.mx th{border:0;padding:0}
.mx th{font-size:10.5px;text-align:center;padding:2px 3px}
.mx td.c{width:30px;height:22px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;border-radius:3px;cursor:pointer;position:relative}
.mx td.c.x::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.mx td.c.none{background:var(--soft);color:var(--muted);cursor:default}
.mx td.lab{padding-right:8px;white-space:nowrap;font-size:12px}
/* requirement rows */
.rq{border-bottom:1px solid var(--line)}
.rq>summary{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:10px;align-items:center;padding:6px 2px;cursor:pointer;list-style:none}
.rq>summary::-webkit-details-marker{display:none}
.rq>summary:hover{background:var(--soft)}
.rq .body{padding:4px 2px 12px;display:grid;gap:8px}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.lab-s{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
.filters button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.filters input{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 9px;min-width:200px}
.md h1,.md h2{font-size:15px;margin:12px 0 4px}.md h3{font-size:13.5px;margin:10px 0 4px}
.md p{margin:0 0 8px;max-width:900px}.md ul{margin:0 0 8px;padding-left:20px}
#tip{position:fixed;display:none;pointer-events:none;z-index:20;max-width:340px;background:var(--ink);color:var(--bg);
  font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;white-space:pre-line}
@media (max-width:820px){body{display:block}#side{width:auto;border-right:0;border-bottom:1px solid var(--line)}#main{padding:16px}}
</style>
</head>
<body>
<nav id="side"></nav>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
<script type="application/json" id="data">__DASHBOARD_DATA__</script>
<script>
// The data is injected by scripts/build_dashboard.py. Opened as the bare template, say so instead of going blank.
const RAW = document.getElementById("data").textContent.trim();
if (RAW.startsWith("__")) {
  document.body.innerHTML = `<main id="main" style="padding:40px"><h2>This is the dashboard template, not the dashboard</h2>
    <p>Build and open the real page with <code>python scripts/build_dashboard.py --open</code> (or <code>bin/dashboard.sh</code>),
    then open <code>outputs/dashboard.html</code>.</p></main>`;
  throw new Error("template opened directly");
}
const DATA = JSON.parse(RAW);

// ---------- vocabulary ----------
const SLOTS = ["scope", "condition", "actor", "modalVerb", "action"];
const SLOT_LABEL = {scope: "Scope", condition: "Condition", actor: "Actor", modalVerb: "Modal verb", action: "Action"};
const REQUIRED = new Set(["actor", "modalVerb", "action"]);
const MODELS = ["haiku", "sonnet", "opus"];
const MODEL_LABEL = {haiku: "Haiku 4.5", sonnet: "Sonnet 5.5", opus: "Opus 5.5"};
const STRATS = ["zsl", "fsl", "cot"];
const STRAT_LABEL = {zsl: "Zero-shot", fsl: "Few-shot", cot: "Chain-of-thought"};
const EXPS = {
  1: {title: "Experiment 1 · Atomic", short: "Atomic", unit: "requirement",
      about: "35 atomic requirements (curated gold, gold_atomic.csv). Normal conversion: one Rimay per requirement."},
  2: {title: "Experiment 2 · Non-atomic (units)", short: "Non-atomic", unit: "unit",
      about: "15 non-atomic requirements → 42 units (gold_units.csv). The prompt says the requirement is non-atomic and how many units to return. " +
             "Each returned unit is matched to a gold unit by similarity to the annotators' texts, then scored like an atomic requirement."},
  3: {title: "Experiment 3 · Blind (atomicity not given)", short: "Blind", unit: "unit",
      about: "All 50 requirements (35 atomic + 15 non-atomic → 77 units, gold_all_units.csv). The prompt says neither whether the requirement is non-atomic nor how many units to return; " +
             "the model decides. Units are matched to the gold as in experiment 2; an atomic requirement is one unit."},
};
const EXP_KEY = {1: "atomic", 2: "units", 3: "blind"};
const EXP_IDS = Object.keys(EXPS).map(Number);
const batchOf = (e, m) => `exp${e}_${EXP_KEY[e]}_${m}`;

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const num = x => typeof x === "number" && isFinite(x);
const pct = x => num(x) ? Math.round(x * 100) + "%" : "—";
const f3 = x => num(x) ? x.toFixed(3) : "—";
const f2 = x => num(x) ? x.toFixed(2) : "—";
const median = a => { const v = a.filter(num).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const quant = (a, q) => { const v = a.filter(num).sort((x, y) => x - y); if (!v.length) return null; const p = (v.length - 1) * q, lo = Math.floor(p); return v[lo] + (v[Math.min(lo + 1, v.length - 1)] - v[lo]) * (p - lo); };
const mean = a => { const v = a.filter(num); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const modelOf = id => (String(id || "").match(/haiku|sonnet|opus/) || ["other"])[0];
const swatch = m => `<i class="sw" style="background:var(--m-${MODELS.includes(m) ? m : "other"})"></i>`;
const mname = m => `<span class="mname">${swatch(m)}${esc(MODEL_LABEL[m] || m)}</span>`;
const slotTag = k => REQUIRED.has(k) ? `<span class="tag reqd" title="Required by the Rimay grammar">req</span>` : `<span class="tag" title="Optional in the Rimay grammar">opt</span>`;
const href = (...parts) => "#/" + parts.map(encodeURIComponent).join("/");
// sequential cell fill: the value's share of the hue over the card surface
const heat = (v, max = 1) => num(v) ? `background:color-mix(in oklab, var(--heat) ${Math.round(8 + 47 * Math.max(0, Math.min(1, v / max)))}%, transparent)` : "";

// ---------- runs and their metrics ----------
function metrics(r) {
  const fa = r.field_accuracy, cq = r.conversion_quality, n = fa.n;
  const c = fa.overall_verdict.confusion;
  const tp = c.both_incomplete, fp = c.llm_incomplete_gold_complete, fn = c.gold_incomplete_llm_complete, tn = c.both_complete;
  const prec = tp + fp ? tp / (tp + fp) : null, rec = tp + fn ? tp / (tp + fn) : null;
  const f1 = rec === null ? null : (prec && rec ? 2 * prec * rec / (prec + rec) : 0);
  const slotAcc = {};
  SLOTS.forEach(s => { const p = fa.per_slot[s]; slotAcc[s] = n ? (p.tp + p.tn) / n : null; });
  const cos = r.requirements.map(q => q.similarity.cosine_mean), seq = r.requirements.map(q => q.similarity.seq_ratio_mean);
  const hh = cq.similarity.human_human;
  const u = r.units;
  return {
    n, conf: {tp, fp, fn, tn}, agree: n ? (tp + tn) / n : null, prec, rec, f1,
    slotAcc, slotAccAll: mean(Object.values(slotAcc)),
    missRecall: fa.missing_analysis.overall.flag_rate, missN: fa.missing_analysis.overall.n_missing,
    missFlagged: fa.missing_analysis.overall.llm_flagged_missing, missPrec: fa.micro.precision,
    impliedFill: fa.implied_analysis.overall.fill_rate, impliedN: fa.implied_analysis.overall.n_implied,
    cos, seq, cosMed: median(cos), seqMed: median(seq),
    hhCos: hh.cosine ? hh.cosine.median : null, hhSeq: hh.seq_ratio ? hh.seq_ratio.median : null,
    paska: cq.paska.pass_rate, paskaN: cq.paska.n_scored, smells: cq.paska.smell_frequency || {},
    exact: u ? u.exactCount / u.requirements : null, units: u,
    detF1: u && u.nonAtomicDetection ? u.nonAtomicDetection.f1 : null,
    anom: r.anomalies || null,
    goldIncomplete: tp + fn,
  };
}
const RUNS = DATA.runs.map(r => {
  const [batch, strat] = r.run.split("/");
  const m = batch.match(/^exp(\d+)_([a-z]+)_([a-z0-9]+)$/);
  return {...r, batch, strat: r.strategy || strat, exp: m ? +m[1] : null,
          model: m ? m[3] : modelOf(r.meta && r.meta.model), M: metrics(r)};
}).filter(r => r.strat);
const byExp = e => RUNS.filter(r => r.exp === e);
const find = (e, m, s) => RUNS.find(r => r.exp === e && r.model === m && r.strat === s);
const LEGACY = [...new Set(RUNS.filter(r => r.exp === null).map(r => r.batch))];
const stratOrder = (a, b) => STRATS.indexOf(a.strat) - STRATS.indexOf(b.strat);

// The headline metrics, all higher-is-better and on 0–1.
const METRICS = [
  {k: "agree", label: "Verdict agreement", f: pct, tip: "Share where the model's complete/incomplete verdict equals the gold."},
  {k: "f1", label: "Incomplete F1", f: f2, tip: "F1 for detecting incomplete requirements (the positive class). Undefined when the gold has none."},
  {k: "slotAccAll", label: "Slot accuracy", f: pct, tip: "Mean over the five slots of: model says missing ⇔ gold says missing."},
  {k: "missRecall", label: "Missing flagged", f: pct, tip: "Of the slots the gold marks missing, the share the model flagged with a placeholder (recall)."},
  {k: "impliedFill", label: "Implied filled", f: pct, tip: "Of the slots the gold marks implied, the share the model filled in rather than flagging."},
  {k: "cosMed", label: "Cosine to humans", f: f3, tip: "Median over requirements of the mean cosine between the model's Rimay and each annotator's."},
  {k: "paska", label: "Paska pass", f: pct, tip: "Share of conversions on which Paska fires no smell."},
];
const UNIT_METRIC = {k: "exact", label: "Exact unit count", f: pct, tip: "Share of requirements where the model returned exactly the number of units asked for."};
const DET_METRIC = {k: "detF1", label: "Non-atomic detected (F1)", f: f2, tip: "Experiment 3: F1 for spotting non-atomic requirements — gold has more than one unit vs the model returned more than one."};
// Score bands, all metrics higher-is-better: [good from, moderate from]. Rationale in BAND_NOTE.
const BANDS = {agree: [.8, .6], f1: [.8, .6], slotAccAll: [.8, .6], slot: [.8, .6], missRecall: [.8, .6], impliedFill: [.8, .6],
               detF1: [.8, .6], paska: [.8, .5], exact: [.9, .7], cells: [1, .8]};
function band(k, v, r) {
  if (!num(v)) return "";
  if (k === "cosMed") {  // relative to the human ↔ human ceiling of the same run
    const hh = r && r.M.hhCos; if (!num(hh)) return "";
    return v >= hh - .03 ? "q-good" : v >= hh - .10 ? "q-mid" : "q-low";
  }
  const b = BANDS[k]; if (!b) return "";
  return v >= b[0] ? "q-good" : v >= b[1] ? "q-mid" : "q-low";
}
const BAND_KEY = `<span class="qkey" style="background:var(--q-good)"></span>good ↑<span class="qkey" style="background:var(--q-mid)"></span>moderate<span class="qkey" style="background:var(--q-low)"></span>poor ↓`;
const BAND_NOTE = [
  ["Agreement, slot accuracy, missing flagged, implied filled, F1s", "good ≥ .80 · moderate ≥ .60 · poor < .60 — the usual reporting bands for classification scores, in line with Landis & Koch's agreement cut-offs (.61 substantial, .81 almost perfect)."],
  ["Cosine to humans", "judged against the human ↔ human ceiling of the same experiment: good within .03 (human parity) · moderate within .10 · poor below. Raw cosine from small sentence encoders is high even for loosely related sentences, so a fixed scale would mislead."],
  ["Paska pass", "good ≥ .80 · moderate ≥ .50 · poor < .50."],
  ["Exact unit count", "good ≥ .90 · moderate ≥ .70 · poor < .70 — returning the right number of units is instruction following, so the bar is higher."],
  ["Requirement × run matrix", "good = 5/5 slots right · moderate = 4/5 · poor ≤ 3/5."],
];
const metricsFor = e => e === 3 ? [...METRICS, UNIT_METRIC, DET_METRIC] : e === 2 ? [...METRICS, UNIT_METRIC] : METRICS;

// ---------- tooltip ----------
document.addEventListener("pointermove", e => {
  const tip = $("#tip"), t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px";
  tip.style.top = Math.min(e.clientY + 16, innerHeight - 80) + "px";
});

// ---------- chart pieces ----------
const at = v => (Math.max(0, Math.min(1, v)) * 100).toFixed(2) + "%";
const TICKS = [0, .25, .5, .75, 1];
const grid = () => TICKS.map(t => `<i class="gl" style="left:${at(t)}"></i>`).join("");
const axis = (lead, trail = 0, fmt = t => t) => `${"<div></div>".repeat(lead)}<div class="axis">${TICKS.map(t => `<span style="left:${at(t)}">${fmt(t)}</span>`).join("")}</div>${"<div></div>".repeat(trail)}`;
const legend = models => `<div class="legend">${models.map(m => `<span>${swatch(m)}${esc(MODEL_LABEL[m] || m)}</span>`).join("")}</div>`;

// One panel per metric: rows are strategies, one dot per model (each in its own lane).
function comparePanels(e) {
  const models = MODELS.filter(m => byExp(e).some(r => r.model === m));
  if (!models.length) return `<p class="hint">No runs scored yet.</p>`;
  const lane = m => 50 + (models.indexOf(m) - (models.length - 1) / 2) * 26;
  return legend(models) + `<div class="panels">${metricsFor(e).map(mt => `<div class="panel">
      <h4>${esc(mt.label)}</h4><p class="hint">${esc(mt.tip)}</p>
      <div class="cg dots">${STRATS.map(s => `<div>${esc(STRAT_LABEL[s])}</div><div class="plot">${grid()}${models.map(m => {
        const r = find(e, m, s), v = r && r.M[mt.k];
        if (!num(v)) return "";
        return `<i class="dot" style="left:${at(v)};top:${lane(m)}%;background:var(--m-${m})"></i>
          <a class="hit" href="${href("run", r.batch, r.strat)}" style="left:${at(v)};top:${lane(m)}%" data-tip="${esc(`${mt.f(v)}  ${MODEL_LABEL[m]} · ${STRAT_LABEL[s]}`)}"></a>`;
      }).join("")}</div>`).join("")}${axis(1, 0, t => mt.f === f3 || mt.f === f2 ? t : Math.round(t * 100) + "%")}</div></div>`).join("")}</div>`;
}

// Box (Q1–Q3), median, min–max, every value as a dot; dashed line = human↔human median.
function boxRows(rows, ref, refLabel) {
  return `<div class="cg box">
    <div></div><div class="hint">${ref !== null && ref !== undefined ? `dashed line: ${esc(refLabel)} ${f3(ref)}` : ""}</div><div class="hint" style="text-align:right">median</div>
    ${rows.map(({label, values, color, tipOf}) => {
      const v = values.filter(x => num(x.v)); if (!v.length) return `<div>${label}</div><div class="hint">no values</div><div></div>`;
      const vs = v.map(x => x.v), q1 = quant(vs, .25), q3 = quant(vs, .75), md = median(vs), lo = Math.min(...vs), hi = Math.max(...vs);
      return `<div>${label}</div><div class="plot">${grid()}
        <i class="whisk" style="left:${at(lo)};width:calc(${at(hi)} - ${at(lo)})"></i>
        <i class="box" style="left:${at(q1)};width:calc(${at(q3)} - ${at(q1)})"></i>
        ${v.map((x, i) => `<i class="sdot" style="left:${at(x.v)};top:${28 + ((i * 37) % 45)}%;background:${color}" data-tip="${esc(tipOf(x))}"></i>`).join("")}
        <i class="med" style="left:${at(md)}" data-tip="median ${f3(md)} · Q1 ${f3(q1)} · Q3 ${f3(q3)} · n ${vs.length}"></i>
        ${num(ref) ? `<i class="ref" style="left:${at(ref)}"></i>` : ""}</div><div class="n" style="text-align:right;font-variant-numeric:tabular-nums">${f3(md)}</div>`;
    }).join("")}${axis(1, 1)}</div>`;
}

// ---------- tables ----------
// Every run of an experiment, every headline metric; the best value per column in bold.
function scoreboard(e, onlyModel) {
  const ms = metricsFor(e);
  const rows = []; MODELS.forEach(m => { if (!onlyModel || onlyModel === m) STRATS.forEach(s => rows.push({m, s, r: find(e, m, s)})); });
  const best = {}; ms.forEach(mt => { const v = rows.map(x => x.r && x.r.M[mt.k]).filter(num); best[mt.k] = v.length ? Math.max(...v) : null; });
  return `<div class="scroll"><table>
    <tr><th>Model</th><th>Strategy</th>${ms.map(mt => `<th class="n" data-tip="${esc(mt.tip)}">${esc(mt.label)}</th>`).join("")}<th class="n" data-tip="Requirements with at least one anomaly (format breach, wrong unit count, empty or truncated answer…). See the Anomalies card.">anomalies</th><th class="n">n</th></tr>
    ${rows.map(({m, s, r}, i) => `<tr class="${i && s === "zsl" ? "sep" : ""}">
      <td>${s === "zsl" ? mname(m) : ""}</td>
      <td>${r ? `<a href="${href("run", r.batch, r.strat)}">${esc(STRAT_LABEL[s])}</a>` : `<span class="hint">${esc(STRAT_LABEL[s])}</span>`}</td>
      ${ms.map(mt => { const v = r && r.M[mt.k];
        if (!r) return `<td class="na">·</td>`;
        if (!num(v)) return `<td class="na" data-tip="${mt.k === "f1" ? "No incomplete " + EXPS[e].unit + "s in the gold, so F1 is undefined." : "Not available"}">n/a</td>`;
        return `<td class="hm ${band(mt.k, v, r)} ${v === best[mt.k] && rows.filter(x => x.r).length > 1 ? "best" : ""}">${mt.f(v)}</td>`; }).join("")}
      <td class="n">${anomChip(r)}</td><td class="n hint">${r ? r.M.n : ""}</td></tr>`).join("")}
  </table></div>
  <p class="hint" style="margin:8px 0 0">${BAND_KEY} (bands under "How to read the metrics" on the overview) · <b>bold</b> = best in the column · · = not run yet. Hover a header for its definition.</p>`;
}

function slotTable(runs, kind) {
  const val = (r, s) => {
    const fa = r.field_accuracy;
    if (kind === "missing") { const x = fa.missing_analysis.per_slot[s]; return {v: x.n_missing ? x.flag_rate : null, t: `${x.llm_flagged_missing}/${x.n_missing}`}; }
    return {v: r.M.slotAcc[s], t: pct(r.M.slotAcc[s])};
  };
  const support = runs.length ? runs[0].field_accuracy.missing_analysis.per_slot : null;
  return `<div class="scroll"><table>
    <tr><th>Run</th>${SLOTS.map(s => `<th class="n">${SLOT_LABEL[s]} ${slotTag(s)}</th>`).join("")}</tr>
    ${kind === "missing" && support ? `<tr><td class="hint">gold missing</td>${SLOTS.map(s => `<td class="n hint">${support[s].n_missing}</td>`).join("")}</tr>` : ""}
    ${runs.map(r => `<tr><td>${runLabel(r)}</td>${SLOTS.map(s => { const {v, t} = val(r, s);
      return num(v) ? `<td class="hm ${band("slot", v)}" data-tip="${esc(`${SLOT_LABEL[s]} · ${runName(r)}: ${t}${kind === "missing" ? " flagged (" + pct(v) + ")" : ""}`)}">${esc(t)}</td>`
                    : `<td class="na" data-tip="The gold has no missing ${SLOT_LABEL[s].toLowerCase()} here">—</td>`; }).join("")}</tr>`).join("")}
  </table></div>`;
}

function smellTable(runs) {
  const kinds = [...new Set(runs.flatMap(r => Object.keys(r.M.smells)))].sort();
  if (!kinds.length) return `<p class="hint">No Paska smells fired.</p>`;
  const max = Math.max(1, ...runs.flatMap(r => Object.values(r.M.smells)));
  return `<div class="scroll"><table><tr><th>Run</th><th class="n">pass</th>${kinds.map(k => `<th class="n">${esc(k)}</th>`).join("")}</tr>
    ${runs.map(r => `<tr><td>${runLabel(r)}</td><td class="n">${pct(r.M.paska)}</td>${kinds.map(k => { const v = r.M.smells[k] || 0;
      return v ? `<td class="hm" style="${heat(v, max)}">${v}</td>` : `<td class="na">·</td>`; }).join("")}</tr>`).join("")}</table></div>
  <p class="hint" style="margin:6px 0 0">Counts of conversions on which each smell fired.</p>`;
}

function unitsTable(runs) {
  return `<div class="scroll"><table><tr><th>Run</th><th class="n">units returned / gold</th><th class="n">exact count</th><th class="n">re-ordered</th><th class="n">gold units left empty</th><th class="n">extra units</th></tr>
    ${runs.map(r => { const u = r.units; if (!u) return "";
      const miss = u.perRequirement.reduce((s, x) => s + x.missingGoldUnits.length, 0), extra = u.perRequirement.reduce((s, x) => s + x.extraLlmUnits.length, 0);
      return `<tr><td>${runLabel(r)}</td><td class="n">${u.returnedUnits} / ${u.expectedUnits}</td><td class="n">${u.exactCount} / ${u.requirements}</td>
        <td class="n">${u.reordered}</td><td class="n">${miss}</td><td class="n">${extra}</td></tr>`; }).join("")}</table></div>
  <p class="hint" style="margin:6px 0 0">Re-ordered = the model's units were matched to the gold in a different order than returned.</p>`;
}

// ---------- anomalies ----------
const anomChip = r => { const a = r && r.M.anom; if (!a) return r ? `<span class="hint">—</span>` : "";
  if (!a.affected) return `<span class="hint">0</span>`;
  return `<a class="chip bad" href="${href("run", r.batch, r.strat)}" data-tip="${esc(Object.entries(a.counts).map(([k, v]) => `${v} × ${a.kinds[k]}`).join("; "))}">${a.affected}</a>`; };
const reqLink = (e, id) => `<a href="${href("req", e, e >= 2 ? id + "#1" : id)}">${esc(id)}</a>`;
function anomalyItems(r) {
  const a = r.M.anom; if (!a || !a.items.length) return `<p class="hint">None.</p>`;
  return `<ul class="anl">${a.items.map(i => `<li><span class="tag inc">${esc(i.kind.replace(/_/g, " "))}</span> ${reqLink(r.exp, i.reqId)}${i.detail ? ` <span class="hint">${esc(i.detail)}</span>` : ""}</li>`).join("")}</ul>`;
}
function anomalyTable(runs) {
  const rows = runs.filter(r => r.M.anom);
  if (!rows.length) return `<p class="hint">These runs were scored before anomaly tracking.</p>`;
  const kinds = Object.keys(rows[0].M.anom.kinds).filter(k => rows.some(r => r.M.anom.counts[k]));
  if (!kinds.length) return `<p class="hint">No anomalies in any run.</p>`;
  const max = Math.max(1, ...rows.flatMap(r => kinds.map(k => r.M.anom.counts[k] || 0)));
  return `<div class="scroll"><table><tr><th>Run</th>${kinds.map(k => `<th class="n" data-tip="${esc(rows[0].M.anom.kinds[k])}">${esc(k.replace(/_/g, " "))}</th>`).join("")}<th class="n">requirements affected</th></tr>
    ${rows.map(r => `<tr><td>${runLabel(r)}</td>${kinds.map(k => { const v = r.M.anom.counts[k] || 0;
      return v ? `<td class="hm" style="${heat(v, max)}">${v}</td>` : `<td class="na">·</td>`; }).join("")}<td class="n">${r.M.anom.affected}</td></tr>`).join("")}</table></div>
  <p class="hint" style="margin:6px 0 0">Hover a header for its meaning. Open a run below for the requirements involved.</p>
  ${rows.filter(r => r.M.anom.items.length).map(r => `<details class="anr"><summary>${esc(runName(r))} — ${r.M.anom.items.length}</summary>${anomalyItems(r)}</details>`).join("")}`;
}
// Units returned per requirement and run, for requirements where any run is off the gold or the runs disagree.
function countMatrix(e) {
  const runs = []; MODELS.forEach(m => STRATS.forEach(s => { const r = find(e, m, s); if (r && r.units) runs.push(r); }));
  if (!runs.length) return `<p class="hint">No runs yet.</p>`;
  const rows = {};
  runs.forEach((r, j) => r.units.perRequirement.forEach(q => { (rows[q.reqId] ||= {gold: q.expected, v: []}).v[j] = q.returned; }));
  const ids = Object.keys(rows).filter(id => rows[id].v.some(v => v !== rows[id].gold)).sort((a, b) =>
    rows[b].v.filter(v => v !== rows[b].gold).length - rows[a].v.filter(v => v !== rows[a].gold).length);
  if (!ids.length) return `<p class="hint">Every run returned the gold number of units on every requirement.</p>`;
  return `<div class="scroll"><table class="cm"><tr><th>Requirement</th><th class="n">gold</th>${runs.map(r => `<th class="n" data-tip="${esc(runName(r))}">${swatch(r.model)}${esc(r.strat)}</th>`).join("")}</tr>
    ${ids.map(id => `<tr><td>${reqLink(e, id)}</td><td class="n"><b>${rows[id].gold}</b></td>${runs.map((r, j) => { const v = rows[id].v[j], g = rows[id].gold;
      return v === undefined ? `<td class="na">·</td>` : `<td class="n ${v === g ? "hint" : v > g ? "over" : "under"}" data-tip="${esc(runName(r))}: ${v} returned, gold ${g}">${v}</td>`; }).join("")}</tr>`).join("")}</table></div>
  <p class="hint" style="margin:6px 0 0">${ids.length} of ${Object.keys(rows).length} requirements. <span class="over">Amber</span> = more units than the gold, <span class="under">red</span> = fewer. Most-disputed first.</p>`;
}

// Experiment 3: did the model spot which requirements are non-atomic, and how far off was the count?
function detectionTable(runs) {
  const rows = runs.filter(r => r.units && r.units.nonAtomicDetection);
  const offBy = r => { const c = {}; r.units.perRequirement.forEach(x => { const d = x.returned - x.expected; c[d] = (c[d] || 0) + 1; }); return c; };
  const diffs = [...new Set(rows.flatMap(r => Object.keys(offBy(r)).map(Number)))].sort((a, b) => a - b);
  const max = Math.max(1, ...rows.flatMap(r => Object.values(offBy(r))));
  return `<div class="scroll"><table><tr><th>Run</th><th class="n" data-tip="non-atomic, split">TP</th><th class="n" data-tip="atomic, but split">FP</th><th class="n" data-tip="non-atomic, kept as one">FN</th><th class="n" data-tip="atomic, kept as one">TN</th>
      <th class="n">precision</th><th class="n">recall</th><th class="n">F1</th>${diffs.map(d => `<th class="n" data-tip="requirements where returned − gold units = ${d}">${d > 0 ? "+" + d : d}</th>`).join("")}</tr>
    ${rows.map(r => { const d = r.units.nonAtomicDetection, o = offBy(r);
      return `<tr><td>${runLabel(r)}</td><td class="n">${d.tp}</td><td class="n">${d.fp}</td><td class="n">${d.fn}</td><td class="n">${d.tn}</td>
        <td class="n">${f2(d.precision)}</td><td class="n">${f2(d.recall)}</td><td class="n">${f2(d.f1)}</td>
        ${diffs.map(k => o[k] ? `<td class="hm" style="${k ? heat(o[k], max) : ""}">${o[k]}</td>` : `<td class="na">·</td>`).join("")}</tr>`; }).join("")}</table></div>
  <p class="hint" style="margin:6px 0 0">Positive = non-atomic (gold has more than one unit); predicted non-atomic = the model returned more than one.
    The right-hand columns count requirements by returned − gold units (0 = exact).</p>`;
}

const runName = r => r.exp ? `${MODEL_LABEL[r.model] || r.model} · ${STRAT_LABEL[r.strat] || r.strat}` : `${r.batch} · ${r.strat}`;
const runLabel = r => `<a href="${href("run", r.batch, r.strat)}" class="mname">${swatch(r.model)}${esc(runName(r))}</a>`;

function confusion(M, unit) {
  const c = M.conf, cell = (v, t, good) => `<td class="n" style="${heat(v, Math.max(1, M.n))}" data-tip="${esc(t)}"><b>${v}</b> ${good ? "" : ""}</td>`;
  return `<table style="width:auto"><tr><th></th><th class="n">model: incomplete</th><th class="n">model: complete</th></tr>
    <tr><th>gold: incomplete</th>${cell(c.tp, "Both say incomplete (hit)", 1)}${cell(c.fn, "Gold incomplete, model says complete (miss)")}</tr>
    <tr><th>gold: complete</th>${cell(c.fp, "Gold complete, model says incomplete (false alarm)")}${cell(c.tn, "Both say complete", 1)}</tr></table>
    <p class="hint" style="margin:6px 0 0">${M.goldIncomplete ? `Precision ${f2(M.prec)} · recall ${f2(M.rec)} · F1 ${f2(M.f1)} on the incomplete class.`
      : `The gold has no incomplete ${unit}s, so precision/recall/F1 are undefined; read agreement.`}</p>`;
}

// tiny markdown → html (headings, bold, code, bullets, paragraphs)
function md(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const out = []; let list = false;
  for (const raw of String(text || "").split(/\n/)) {
    const l = raw.trimEnd(), h = l.match(/^(#{1,3})\s+(.*)/), b = l.match(/^\s*[-*]\s+(.*)/);
    if (!b && list) { out.push("</ul>"); list = false; }
    if (h) out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`);
    else if (b) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(b[1])}</li>`); }
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  if (list) out.push("</ul>");
  return `<div class="md">${out.join("")}</div>`;
}

// ---------- requirement matrix ----------
// Rows: requirements (hardest first). Columns: runs. Cell: slots right of 5; red dot = verdict wrong.
function matrix(e) {
  const runs = []; MODELS.forEach(m => STRATS.forEach(s => { const r = find(e, m, s); if (r) runs.push(r); }));
  if (!runs.length) return `<p class="hint">No runs yet.</p>`;
  const ids = [...new Set(runs.flatMap(r => r.requirements.map(q => q.reqId)))];
  const cell = (r, id) => r.requirements.find(q => q.reqId === id);
  const score = id => mean(runs.map(r => { const q = cell(r, id); return q ? SLOTS.filter(s => q.slot_match[s]).length + (q.verdict_match ? 0 : -1) : null; }));
  ids.sort((a, b) => score(a) - score(b));
  const models = MODELS.filter(m => runs.some(r => r.model === m));
  return `<div class="scroll"><table class="mx">
    <tr><th></th>${models.map(m => `<th colspan="${runs.filter(r => r.model === m).length}">${mname(m)}</th>`).join("")}</tr>
    <tr><th></th>${runs.map(r => `<th class="hint" data-tip="${esc(STRAT_LABEL[r.strat])}">${r.strat}</th>`).join("")}</tr>
    ${ids.map(id => { const g = runs.map(r => cell(r, id)).find(Boolean);
      return `<tr><td class="lab"><a href="${href("req", e, id)}">${esc(id)}</a> ${g && g.gold_overall ? `<span class="tag inc">incomplete</span>` : ""}</td>
      ${runs.map(r => { const q = cell(r, id); if (!q) return `<td class="c none">·</td>`;
        const ok = SLOTS.filter(s => q.slot_match[s]).length, wrong = SLOTS.filter(s => !q.slot_match[s]).map(s => SLOT_LABEL[s]);
        return `<td class="c ${band("cells", ok / 5)} ${q.verdict_match ? "" : "x"}" onclick="location.hash='${href("req", e, id)}'"
          data-tip="${esc(`${id} · ${runName(r)}\n${ok}/5 slots right${wrong.length ? " — wrong: " + wrong.join(", ") : ""}\nverdict ${q.verdict_match ? "matches" : "WRONG"} · cosine ${f3(q.similarity.cosine_mean)} · Paska ${q.paska_passed === null ? "—" : q.paska_passed ? "pass" : "fail"}`)}">${ok}</td>`; }).join("")}</tr>`; }).join("")}
  </table></div>
  <p class="hint" style="margin:6px 0 0">Each cell: slots where the model's missing/not-missing call matches the gold (of 5): ${BAND_KEY.replace(/ [↑↓]/g, "")} = 5 / 4 / ≤ 3. <span style="color:var(--bad)">●</span> = verdict wrong.
    Hardest ${EXPS[e].unit}s first. Click a row to compare every run on it.</p>`;
}

// ---------- requirement detail ----------
function slotChips(q) {
  return `<div class="slots">${SLOTS.map(s => `<span class="chip ${q.slot_match[s] ? "ok" : "bad"}" data-tip="${esc(`${SLOT_LABEL[s]}: gold ${q.gold_slots[s]}, model ${q.llm_slots[s]}`)}">${q.slot_match[s] ? "✓" : "✗"} ${SLOT_LABEL[s]}</span>`).join("")}</div>`;
}
function reqBody(q, withHumans = true) {
  return `<div><p class="lab-s">Model Rimay</p><div class="mono">${esc(q.llm_rimay || "(no unit returned)")}</div></div>
    ${slotChips(q)}
    <div class="hint">Verdict: gold <b>${q.gold_overall ? "incomplete" : "complete"}</b>, model <b>${q.llm_overall ? "incomplete" : "complete"}</b> ·
      cosine to humans ${f3(q.similarity.cosine_mean)} (max ${f3(q.similarity.cosine_max)}) · seq_ratio ${f3(q.similarity.seq_ratio_mean)} ·
      Paska ${q.paska_passed === null ? "—" : q.paska_passed ? "pass" : "<b style='color:var(--bad)'>fail</b>"}</div>
    ${(q.paska_smells || []).length ? `<div class="hint">Smells: ${q.paska_smells.map(s => `<b>${esc(s.smell)}</b> — ${esc(s.value)}`).join("; ")}</div>` : ""}
    ${withHumans ? `<details><summary class="hint">Source NL and the annotators' Rimay</summary><div class="mono" style="margin:6px 0">${esc(q.nl_text)}</div>
      ${q.human_rimays.map(h => `<div class="mono hint" style="margin-top:4px">• ${esc(h)}</div>`).join("")}</details>` : ""}`;
}

// ---------- views ----------
function viewOverview() {
  const total = RUNS.filter(r => r.exp).length;
  return `<div class="crumbs">Overview</div><h2>Rimay conversion experiments</h2>
    <p class="lede">Three models × three prompting strategies, scored against the curated gold of three annotators.
      ${total} of 27 runs scored · built ${esc(new Date(DATA.generatedAt).toLocaleString())}.</p>
    ${EXP_IDS.map(e => `<div class="card"><h3><a href="${href("exp", e)}">${esc(EXPS[e].title)}</a></h3><p class="hint">${esc(EXPS[e].about)}</p>
      ${scoreboard(e)}</div>`).join("")}
    <div class="card"><h3>How to read the metrics</h3>
      <table style="width:auto">${[...METRICS, UNIT_METRIC, DET_METRIC].map(m => `<tr><td><b>${esc(m.label)}</b></td><td class="hint">${esc(m.tip)}</td></tr>`).join("")}</table>
      <p class="hint" style="margin:8px 0 0">The model's slots are binary (a <code>&lt;MISSING_*&gt;</code> placeholder or not); the gold is present / implied / missing.
        A slot is right when "missing" agrees. Slot tags: <span class="tag reqd">req</span> required by the Rimay grammar, <span class="tag">opt</span> optional.</p>
      <h4 style="margin:14px 0 4px">Colour bands</h4><p class="hint" style="margin:0 0 6px">${BAND_KEY}. Counts (smells, anomalies, confusion cells) stay in blue shading: there, colour shows size, not quality.</p>
      <table style="width:auto">${BAND_NOTE.map(([a, b]) => `<tr><td><b>${esc(a)}</b></td><td class="hint">${esc(b)}</td></tr>`).join("")}</table></div>`;
}

function viewExp(e) {
  const runs = byExp(e).sort((a, b) => MODELS.indexOf(a.model) - MODELS.indexOf(b.model) || stratOrder(a, b));
  const X = EXPS[e];
  if (!runs.length) return `<div class="crumbs"><a href="#/">Overview</a></div><h2>${esc(X.title)}</h2><p class="lede">${esc(X.about)}</p><div class="card">No runs scored yet.</div>`;
  const g = runs[0].M;
  const hh = runs.find(r => num(r.M.hhCos));
  return `<div class="crumbs"><a href="#/">Overview</a> › ${esc(X.short)}</div><h2>${esc(X.title)}</h2><p class="lede">${esc(X.about)}</p>
    <div class="tiles">
      <div class="tile"><b>${g.n}</b><span>${esc(X.unit)}s per run</span></div>
      <div class="tile"><b>${g.goldIncomplete}</b><span>incomplete in the gold</span><small>${g.n - g.goldIncomplete} complete</small></div>
      <div class="tile"><b>${g.missN}</b><span>gold-missing slots</span><small>${g.impliedN} implied</small></div>
      <div class="tile"><b>${hh ? f3(hh.M.hhCos) : "—"}</b><span>human ↔ human cosine</span><small>median, the ceiling to compare against</small></div>
      <div class="tile"><b>${runs.length}</b><span>runs scored</span><small>of 9</small></div>
    </div>
    <div class="card"><h3>Scoreboard</h3>${scoreboard(e)}</div>
    <div class="card"><h3>Models compared, per strategy</h3><p class="hint">Each dot is one run; click it to open the run. Values are in the scoreboard above.</p>${comparePanels(e)}</div>
    <div class="cols">
      <div class="card"><h3>Gold-missing slots the model flagged</h3><p class="hint">flagged / gold-missing, per slot. Scope and condition carry nearly all the support — read the others with their n in mind.</p>${slotTable(runs, "missing")}</div>
      <div class="card"><h3>Slot accuracy</h3><p class="hint">Share of ${esc(X.unit)}s where the model's missing / not-missing call equals the gold.</p>${slotTable(runs, "acc")}</div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Similarity to the annotators — cosine, per ${esc(X.unit)}</h3>
      <p class="hint">Each dot is one ${esc(X.unit)}: the mean cosine between the model's Rimay and each annotator's. Box = middle half, bar = median.</p>
      ${boxRows(runs.map(r => ({label: runLabel(r), color: `var(--m-${r.model})`, values: r.requirements.map(q => ({v: q.similarity.cosine_mean, q})),
        tipOf: x => `${x.q.reqId}: ${f3(x.v)}`})), hh ? hh.M.hhCos : null, "human ↔ human median")}</div>
    <div class="cols">
      <div class="card"><h3>Paska smells</h3>${smellTable(runs)}</div>
      ${e === 2 ? `<div class="card"><h3>Did the model return the units it was asked for?</h3>${unitsTable(runs)}</div>` : ""}
      ${e === 3 ? `<div class="card"><h3>Unit counts</h3>${unitsTable(runs)}</div>` : ""}
    </div>
    ${e === 3 ? `<div class="card" style="margin-top:14px"><h3>Did the model spot the non-atomic requirements?</h3>${detectionTable(runs)}</div>` : ""}
    <div class="card" style="margin-top:14px"><h3>Anomalies</h3><p class="hint">What the models returned that breaks the expected shape. Each is listed with its requirement.</p>${anomalyTable(runs)}</div>
    ${e >= 2 ? `<div class="card" style="margin-top:14px"><h3>Unit counts that miss the gold or disagree between runs</h3>${countMatrix(e)}</div>` : ""}
    <div class="card" style="margin-top:14px"><h3>Every ${esc(X.unit)} × every run</h3>${matrix(e)}</div>
    ${MODELS.map(m => { const b = batchOf(e, m); return DATA.batchVerdicts[b]
      ? `<details class="card"><summary><b>Verdict — ${esc(MODEL_LABEL[m])}</b> <span class="hint">(written by the verdict stage)</span></summary>${md(DATA.batchVerdicts[b])}</details>` : ""; }).join("")}`;
}

function viewBatch(batch) {
  const runs = RUNS.filter(r => r.batch === batch).sort(stratOrder);
  if (!runs.length) return `<div class="card">Unknown batch ${esc(batch)}.</div>`;
  const r0 = runs[0], e = r0.exp, unit = e ? EXPS[e].unit : "requirement";
  const title = e ? `${MODEL_LABEL[r0.model] || r0.model} — ${EXPS[e].short}` : batch;
  return `<div class="crumbs"><a href="#/">Overview</a> › ${e ? `<a href="${href("exp", e)}">${esc(EXPS[e].short)}</a> › ` : "Earlier runs › "}${esc(e ? MODEL_LABEL[r0.model] : batch)}</div>
    <h2>${e ? mname(r0.model) + " " : ""}${esc(e ? EXPS[e].short : batch)}</h2>
    <p class="lede">${e ? esc(EXPS[e].about) : `Gold: <code>${esc(r0.gold_csv)}</code> · model <code>${esc(r0.meta && r0.meta.model)}</code>`}</p>
    ${e ? `<div class="card"><h3>The three strategies</h3>${scoreboard(e, r0.model)}</div>` : ""}
    <div class="cols">${runs.map(r => `<div class="card"><h3><a href="${href("run", r.batch, r.strat)}">${esc(STRAT_LABEL[r.strat] || r.strat)}</a></h3>${confusion(r.M, unit)}</div>`).join("")}</div>
    <div class="cols" style="margin-top:14px">
      <div class="card"><h3>Gold-missing slots flagged</h3>${slotTable(runs, "missing")}</div>
      <div class="card"><h3>Cosine to the annotators</h3>${boxRows(runs.map(r => ({label: esc(STRAT_LABEL[r.strat] || r.strat), color: `var(--m-${MODELS.includes(r.model) ? r.model : "other"})`,
        values: r.requirements.map(q => ({v: q.similarity.cosine_mean, q})), tipOf: x => `${x.q.reqId}: ${f3(x.v)}`})), r0.M.hhCos, "human ↔ human median")}</div>
    </div>
    ${DATA.batchVerdicts[batch] ? `<div class="card" style="margin-top:14px"><h3>Verdict</h3>${md(DATA.batchVerdicts[batch])}</div>` : ""}`;
}

let reqFilter = "all", reqQuery = "";
function viewRun(batch, strat) {
  const r = RUNS.find(x => x.batch === batch && x.strat === strat);
  if (!r) return `<div class="card">Unknown run ${esc(batch)}/${esc(strat)}.</div>`;
  const M = r.M, e = r.exp, unit = e ? EXPS[e].unit : "requirement";
  const fa = r.field_accuracy;
  const slotRows = SLOTS.map(s => { const p = fa.per_slot[s], mi = fa.missing_analysis.per_slot[s], im = fa.implied_analysis.per_slot[s];
    return `<tr><td>${SLOT_LABEL[s]} ${slotTag(s)}</td><td class="n">${p.support_gold_missing}</td><td class="n">${mi.llm_flagged_missing}</td><td class="n">${mi.llm_silently_filled}</td>
      <td class="n">${p.fp}</td><td class="n">${p.tp + p.fp ? f2(p.precision) : "—"}</td><td class="n">${p.support_gold_missing ? f2(p.recall) : "—"}</td>
      <td class="n">${p.support_gold_missing ? f2(p.f1) : "—"}</td><td class="hm ${band("slot", M.slotAcc[s])}">${pct(M.slotAcc[s])}</td>
      <td class="n">${im.n_implied ? `${im.llm_filled}/${im.n_implied}` : "—"}</td></tr>`; }).join("");
  return `<div class="crumbs"><a href="#/">Overview</a> › ${e ? `<a href="${href("exp", e)}">${esc(EXPS[e].short)}</a> › ` : ""}<a href="${href("batch", r.batch)}">${esc(e ? MODEL_LABEL[r.model] : r.batch)}</a> › ${esc(STRAT_LABEL[r.strat] || r.strat)}</div>
    <h2>${mname(r.model)} · ${esc(STRAT_LABEL[r.strat] || r.strat)}</h2>
    <p class="lede"><code>${esc(r.run)}</code> · model <code>${esc(r.meta && r.meta.model)}</code> · gold <code>${esc(r.gold_csv)}</code> · scored ${esc(new Date(r.scored_at).toLocaleString())}</p>
    <div class="tiles">${metricsFor(e).map(mt => `<div class="tile ${band(mt.k, M[mt.k], r)}" data-tip="${esc(mt.tip)}"><b>${num(M[mt.k]) ? mt.f(M[mt.k]) : "n/a"}</b><span>${esc(mt.label)}</span></div>`).join("")}</div>
    <div class="cols">
      <div class="card"><h3>Verdict</h3>${confusion(M, unit)}</div>
      <div class="card"><h3>Cosine to the annotators</h3>${boxRows([{label: esc(STRAT_LABEL[r.strat] || r.strat), color: `var(--m-${MODELS.includes(r.model) ? r.model : "other"})`,
        values: r.requirements.map(q => ({v: q.similarity.cosine_mean, q})), tipOf: x => `${x.q.reqId}: ${f3(x.v)}`}], M.hhCos, "human ↔ human median")}
        <p class="hint" style="margin:6px 0 0">seq_ratio (lexical) median ${f3(M.seqMed)} · humans ${f3(M.hhSeq)}</p></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Per slot</h3><div class="scroll"><table>
      <tr><th>Slot</th><th class="n">gold missing</th><th class="n">flagged</th><th class="n">silently filled</th><th class="n">false flags</th>
        <th class="n">precision</th><th class="n">recall</th><th class="n">F1</th><th class="n">accuracy</th><th class="n">implied → filled</th></tr>${slotRows}</table></div>
      <p class="hint" style="margin:6px 0 0">Positive class = missing. "Silently filled" = the gold says missing but the model wrote content instead of a placeholder.</p></div>
    <div class="cols">
      <div class="card"><h3>Paska smells</h3>${smellTable([r])}</div>
      ${r.units ? `<div class="card"><h3>Units</h3>${unitsTable([r])}</div>` : ""}
      ${e === 3 && r.units ? `<div class="card"><h3>Non-atomic detection</h3>${detectionTable([r])}</div>` : ""}
      ${M.anom ? `<div class="card"><h3>Anomalies <span class="hint">(${M.anom.affected} requirements)</span></h3>${anomalyItems(r)}</div>` : ""}
    </div>
    <div class="card" style="margin-top:14px"><h3>${esc(unit[0].toUpperCase() + unit.slice(1))}s</h3>
      <div class="filters" id="rqf">${[["all", "All"], ["verdict", "Verdict wrong"], ["slots", "Any slot wrong"], ["paska", "Paska failed"]].map(([k, l]) =>
        `<button data-f="${k}" class="${reqFilter === k ? "on" : ""}">${l}</button>`).join("")}<input id="rqq" placeholder="Search id or text" value="${esc(reqQuery)}"><span class="hint" id="rqn"></span></div>
      <div id="rql"></div></div>
    ${r.verdict && r.verdict.text ? `<details class="card"><summary><b>Verdict on this run</b> <span class="hint">${esc(r.verdict.model || "")}</span></summary>${md(r.verdict.text)}</details>` : ""}`;
}
function drawReqList() {
  const [, , batch, strat] = location.hash.split("/").map(decodeURIComponent);
  const r = RUNS.find(x => x.batch === batch && x.strat === strat), host = $("#rql");
  if (!r || !host) return;
  const keep = q => (reqFilter === "all" || (reqFilter === "verdict" && !q.verdict_match) || (reqFilter === "slots" && SLOTS.some(s => !q.slot_match[s]))
    || (reqFilter === "paska" && q.paska_passed === false))
    && (!reqQuery || (q.reqId + " " + q.llm_rimay + " " + q.nl_text).toLowerCase().includes(reqQuery));
  const list = r.requirements.filter(keep);
  $("#rqn").textContent = `${list.length} of ${r.requirements.length}`;
  host.innerHTML = list.map(q => `<details class="rq"><summary><span><a href="${href("req", r.exp ?? "b:" + r.batch, q.reqId)}">${esc(q.reqId)}</a>
      ${q.gold_overall ? `<span class="tag inc">incomplete</span>` : ""}</span>
      <span class="mono" style="font-size:11.5px">${esc(q.llm_rimay || "(no unit returned)")}</span>
      <span class="slots">${SLOTS.map(s => `<i class="sw" style="border-radius:2px;background:var(--${q.slot_match[s] ? "ok" : "bad"})" data-tip="${esc(SLOT_LABEL[s] + (q.slot_match[s] ? " right" : " wrong"))}"></i>`).join("")}
        ${q.verdict_match ? "" : `<span class="chip bad">verdict</span>`}${q.paska_passed === false ? `<span class="chip bad">Paska</span>` : ""}</span></summary>
    <div class="body">${reqBody(q)}</div></details>`).join("") || `<p class="hint">Nothing matches.</p>`;
}

function viewReq(expKey, id) {
  const runs = (String(expKey).startsWith("b:") ? RUNS.filter(r => r.batch === expKey.slice(2)) : byExp(+expKey))
    .sort((a, b) => MODELS.indexOf(a.model) - MODELS.indexOf(b.model) || stratOrder(a, b));
  const rows = runs.map(r => ({r, q: r.requirements.find(q => q.reqId === id)})).filter(x => x.q);
  if (!rows.length) return `<div class="card">No run has ${esc(id)}.</div>`;
  const q0 = rows[0].q, e = +expKey;
  return `<div class="crumbs"><a href="#/">Overview</a> › ${EXPS[e] ? `<a href="${href("exp", e)}">${esc(EXPS[e].short)}</a> › ` : ""}${esc(id)}</div>
    <h2>${esc(id)} ${q0.gold_overall ? `<span class="tag inc">incomplete</span>` : `<span class="tag">complete</span>`}</h2>
    <div class="card"><h3>Source</h3><div class="mono">${esc(q0.nl_text)}</div></div>
    <div class="cols">
      <div class="card"><h3>Gold slots</h3><table style="width:auto">${SLOTS.map(s => `<tr><td>${SLOT_LABEL[s]} ${slotTag(s)}</td><td><b>${esc(q0.gold_slots[s])}</b></td></tr>`).join("")}</table></div>
      <div class="card"><h3>The annotators</h3>${q0.human_rimays.map(h => `<div class="mono" style="margin-bottom:6px">${esc(h)}</div>`).join("")}</div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Every run on this ${EXPS[e] ? EXPS[e].unit : "requirement"}</h3>
      ${rows.map(({r, q}) => `<div class="rq" style="padding:10px 0"><p style="margin:0 0 6px">${runLabel(r)}</p><div class="body" style="padding:0">${reqBody(q, false)}</div></div>`).join("")}</div>`;
}

// ---------- navigation ----------
function sidebar(route) {
  const on = h => (route === h ? "on" : "");
  let html = `<h1>Rimay experiments</h1><p class="sub">${RUNS.filter(r => r.exp).length}/27 runs · ${esc(new Date(DATA.generatedAt).toLocaleDateString())}</p>
    <a href="#/" class="${on("#/")}">Overview</a>`;
  EXP_IDS.forEach(e => {
    html += `<div class="grp">${esc(EXPS[e].title)}</div><a href="${href("exp", e)}" class="${on(href("exp", e))}">All models</a>`;
    MODELS.forEach(m => {
      const b = batchOf(e, m), has = RUNS.some(r => r.batch === b);
      html += `<a href="${href("batch", b)}" class="l2 ${on(href("batch", b))} ${has ? "" : "off"}">${swatch(m)}${esc(MODEL_LABEL[m])}</a>`;
      STRATS.forEach(s => { const r = find(e, m, s); if (r) html += `<a href="${href("run", b, s)}" class="l3 ${on(href("run", b, s))}">${esc(STRAT_LABEL[s])}</a>`; });
    });
  });
  if (LEGACY.length) html += `<div class="grp">Earlier runs</div><details ${LEGACY.some(b => route.includes(encodeURIComponent(b))) ? "open" : ""}><summary>${LEGACY.length} batches (older gold)</summary>
    ${LEGACY.map(b => `<a href="${href("batch", b)}" class="l2 ${on(href("batch", b))}">${esc(b)}</a>`).join("")}</details>`;
  $("#side").innerHTML = html;
}
function route() {
  const h = location.hash || "#/", p = h.slice(2).split("/").map(decodeURIComponent);
  let html;
  if (p[0] === "exp") html = viewExp(+p[1]);
  else if (p[0] === "batch") html = viewBatch(p[1]);
  else if (p[0] === "run") html = viewRun(p[1], p[2]);
  else if (p[0] === "req") html = viewReq(p[1], p.slice(2).join("/"));
  else html = viewOverview();
  sidebar(h === "#" ? "#/" : h);
  $("#main").innerHTML = html;
  $("#main").scrollTop = 0;
  if (p[0] === "run") drawReqList();
}
document.addEventListener("click", e => {
  const b = e.target.closest("#rqf button");
  if (b) { reqFilter = b.dataset.f; document.querySelectorAll("#rqf button").forEach(x => x.classList.toggle("on", x === b)); drawReqList(); }
});
document.addEventListener("input", e => { if (e.target.id === "rqq") { reqQuery = e.target.value.trim().toLowerCase(); drawReqList(); } });
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
