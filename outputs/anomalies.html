<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header h1{font-size:15px;margin:0}
.fg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.fg>span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.fb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:1px 8px;font-size:12px}
.fb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
select,input{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel);color:var(--ink)}
#wrap{flex:1;display:flex;min-height:0}
#list{width:330px;flex:none;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
#main{flex:1;overflow-y:auto;padding:16px 22px 60px;min-width:0}
.li{display:block;padding:7px 12px;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.li:hover{background:var(--soft);text-decoration:none}.li.on{background:var(--accent-soft)}
.li .top{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:12.5px}
.strip{display:flex;gap:2px;margin-top:4px}
.strip i{font-style:normal;width:24px;text-align:center;font-size:10.5px;border-radius:3px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--soft)}
.strip i.over{background:var(--warn-soft);color:var(--warn);font-weight:700}.strip i.under{background:var(--bad-soft);color:var(--bad);font-weight:700}
.strip i.fmt{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.strip i.off{opacity:.25}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{font-size:13.5px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2{font-size:19px;margin:0 0 2px}.hint{font-size:12px;color:var(--muted)}
.mono{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.fmt{background:var(--accent-soft);color:var(--accent)}.tag.reqd{background:var(--bad-soft);color:var(--bad)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0}
.sl{display:inline-flex;gap:3px;flex-wrap:wrap}
.sl b{font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.sl b.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}.sl b.impl{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
tr.gap td{background:var(--bad-soft)}tr.extra td{background:var(--warn-soft)}
.raw{background:var(--soft);border-radius:6px;padding:8px 10px;max-height:460px;overflow:auto}
.raw .blk{background:var(--block);display:block;border-left:3px solid var(--ok);padding-left:6px}
.raw .drop{background:var(--bad-soft);text-decoration:line-through}
.raw .pre{color:var(--muted)}
.kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--soft)}
.sum td.c{text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}.sum td.c:hover{outline:1px solid var(--accent)}
.sum td.z{color:var(--muted);opacity:.5}
details>summary{cursor:pointer}
@media (max-width:800px){#wrap{flex-direction:column}#list{width:auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>

hout many compatibility issues is a custom url sceme: signal:// I know, custom url scemes could be considered bad practice since they pollude the namespace. I agree, but for now signal can't compete with other social media from a buisness standpoint because of missing features like these. This may keep a lot of people from using signal as their favorite messenger app. (world domination is not the goal, but we don't want to shoot ourselfs in the foot either, private messaging will only happen if your contacts are also willing to accept signal on their phone.) Lets consider having share buttons on websites. A custom url sceme would be a good start to make that possible. Send message to Signal Private Messenger Read more about this here", "units": [{"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must provide a \"custom URL scheme\" for sharing.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must provide a \"signal://\" URL scheme.", "<MISSING_SCOPE>, <MISSING_CONDITION>, Signal must provide a custom URL scheme for opening Signal from webpages."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "937-Signal": {"nl": "Request Number - 937 | Request Title - Conversation View: Consistent message order | Request Description - Please correct me, but as far as I can tell, messages are sorted by time of arrival. However, since the messages are transported either via SMS or via Google Cloud Messaging, both of which don't guarantee ordering, messages may appear in the wrong order. This means that chat participants may see deviating orders of messages, replies to messages they don't even see. In theory, it's even possible that several messages from the same sender arrive and are displayed in wrong order.  Idea 1: Sort the conversation view by \"sent\" timestamp. See also Display send date for incoming messages #806. Problem: What is the \"sent\" date? Is it reliable? Is it set by the client or the TS server (farm)? Idea 2: Give each message a sequence number generated by the TextSecure server. Sort conversation view according to those numbers. Problem: Many, but not all messages go through the TS server. Idea 3: Employ vector clocks.", "units": [{"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must sort the \"messages\" in the \"conversation view\" by \"sent timestamp\", \"sequence numbers\" or \"vector clocks\".", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must sort the \"conversation view\" by \"sent\" time.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must display the \"messages\" in the \"conversation view\" in the same order for all \"chat participants\"."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "42-Mastodon": {"nl": "Request Number - 42 | Request Title - Make view from timeline back | Request Description - I like this , because it makes me feel I am not alone on then earth. Every time I view the post from different from the timeline, I can feel they are all alive, not only me. Every time, every second, I can meet new friend, maybe he is in Japan, having dinner, or In French. Now the feature of viewing from timeline is not in mastondon-android. I like the hot trending, then I can know what people are talking now. But I feel lonely when use your app. I find out that it is because I cannot always read a new post, cannot always know who may be will be my friend, what he is doing ,worring. So I need this feature.", "units": [{"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must provide a view of the posts in the \"public timeline\".", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must provide a view of posts from other people.", "<MISSING_SCOPE>, <MISSING_CONDITION>, <MISSING_ACTOR> <MISSING_MODAL_VERB> <MISSING_ACTION>."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "7345-Signal": {"nl": "Request Number - 7345 | Request Title - Better Media Saving Behavior | Request Description - I have:   searched open and closed issues for duplicates  read https://github.com/WhisperSystems/Signal-Android/wiki/Submitting-useful-bug-reports  Bug description. One of the features that was missing for a long time but thankfully has been recently implemented was the ability to swipe through the images without having to keep going back to the index and always having it start at the top. Kudos and thanks for that. However, another element exists that can be greatly improved and probably just got missed; and hopefully can be added. Currently each picture (\"media\") provides you the save button on the top. However, it never detects that the item has already been saved and you have to just remember it or go check your on device gallery to see if it is already there. Instead, it simply keeps making duplicates of the item and just incrementing it. It would't be too difficult to do a simple if/exists > show view/share icon else/doesn't > show save icon (as it is now). This will spare the need to save multiple duplicates and incrementing it when you can simply provide a visual check that it has already been saved. It is simply better UX and cleaner that way. Steps to reproduce.  save an item save it again you have a duplicate with a -1 at the end save it again you now have 3 with a -1 and -2 of the same item repeat and goes on as long as you keep saving Expected result: Detect that the item has already been saved and either provide a view icon or share icon to visually indicate it has been saved already, otherwise show the save button. A simple file system check for the item will facilitate this. Thanks in advance.", "units": [{"humans": ["<MISSING_SCOPE>, if the \"media item\" has already been saved, then the App must change the \"save icon\" to a \"view/share icon\".", "<MISSING_SCOPE>, if a picture has already been saved, then the App must show a view or share icon instead of the save button.", "<MISSING_SCOPE>, if the user has already saved a \"media item\", then the App must show a \"view\" or \"share\" icon instead of the \"save\" button."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "175-Signal": {"nl": "Request Number - 175 | Request Title - Featue Request: Quick way to wipe message database | Request Description - Say for some reason you're being coerced with force to disclose your password, could you make a quick way (say a button combo + confirm dialogue) to wipe the text message database?", "units": [{"humans": ["<MISSING_SCOPE>, when the user triggers a \"specific button combo\" and confirms the \"confirm dialogue\", then the App must wipe the \"text message database\".", "<MISSING_SCOPE>, if the user is being coerced to disclose their password, then the App must let them quickly wipe the message database.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must provide a quick way, such as a \"button combo\" with a \"confirm dialogue\", to wipe the \"text message database\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "2055-Signal": {"nl": "Request Number - 2055 | Request Title - use delivery receipts to show message received time for outgoing messages | Request Description - After long pressing on a message and selecting the info button, the message details are shown. This includes the sent and received times for incoming messages. For outgoing messages, in contrast, only one Sent/Received time is displayed, probably containing sent time. Now that delivery receipts are implemented, it would be possible to display the received time for outgoing messages (by taking the sent time from the receipt). Or to make it more precise, let the receipt message piggybag sage drafts\", for example with a distinct colour or a \"Draft\" tag."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "1692-Signal": {"nl": "Request Number - 1692 | Request Title - sms delivery report: show received time in message details | Request Description - when a sms delivery report is received, the time the other user received the message (afaik the done date ) should be saved and it should be possible to view it in message details. This way one could see when the other user received the message (not only that is was received). edit: if someone can give me a hint where to look/start in the code to implement this, I'd try to make a pull request (but I just glanced through the code and cannot find a starting point ... maybe it's simply too late already ;-))", "units": [{"humans": ["<MISSING_SCOPE>, when user receives SMS delivery report, then the App must save the time the message was actually received.", "<MISSING_SCOPE>, when the App receives an \"SMS delivery report\", then the App must save the time at which the recipient received the message.", "<MISSING_SCOPE>, when the App receives an \"SMS delivery report\", then the App must save the time at which the user received the message."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when user receives SMS delivery report, then the App must show that time in the message details.", "<MISSING_SCOPE>, when the App receives an \"SMS delivery report\", the App must show the saved \"received time\" in the \"message details\".", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must show the saved \"received time\" in the \"message details\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "6390-Signal": {"nl": "Request Number - 6390 | Request Title - Notify sender if Signal message has been sent but not delivered to recipient after some time | Request Description - I have:   searched open and closed issues for duplicates  read https://github.com/WhisperSystems/Signal-Android/wiki/Submitting-useful-bug-reports  Bug description. Recipients who are registered for Signal may not be able to receive secure signal messages due to reasons such as:  temporary unavailability of internet access (e.g. prepay plans with hard data caps; otherwise intermittent data connectivity) permanent unavailability having uninstalled Signal without first unregistering Neither of these are apparent to the sender, and sending a Signal message results in the message sitting on the server for some undefined length of time. The sender does not get notified that while their message has been sent to the server, it has not been delivered to the recipient, leading to frustration once the fact is discovered ( #6377 , #2285 (comment) etc). The status is available in conversation UI in the form of one tick vs two ticks, but this requires the sender to explicitly check back in the conversation UI. It would improve the user experience if a signal message that was sent but not delivered after some timeout (minutes?) triggered a \"lack of delivery\" notification on the senders phone along the lines of \"Your secure message to YYY could not be delivered after N minutes. Would you like to resend via insecure SMS?\" This way it is up to the user to explicitly fall back to the less secure protocol. (This notification proposal is orthogonal to but complementary to the ability of Signal to better remember the per-contact preference of transport channel suggested in #2285 , #845 (comment) etc. It would also serve as an easier to implement and more secure alternative to automatically falling back to SMS as suggested in #678 , #2847 , #3074 , #4009 , #5001 )", "units": [{"humans": ["<MISSING_SCOPE>, if the recipient does not receive a sent \"Signal message\" within a timeout, then the App must notify the \"sender\".", "<MISSING_SCOPE>, if the recipient does not receive a sent \"Signal message\" within a \"timeout\", then the App must notify the \"sender\".", "<MISSING_SCOPE>, if the recipient has not received a sent \"Signal message\" after a \"timeout\", then the System must alert the \"sender\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, if the recipient does not receive a sent \"Signal message\" within a \"timeout\", then the App must provide the \"sender\" an option to resend the message via insecure SMS.", "<MISSING_SCOPE>, if the recipient does not receive a sent \"Signal message\" within a \"timeout\", then the App must allow the \"sender\" an option to resend the message via \"insecure SMS\".", "<MISSING_SCOPE>, if the recipient does not receive a sent \"Signal message\" within a timeout, then the App must offer the \"sender\" an option to resend the message via \"insecure SMS\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "222-Signal": {"nl": "Request Number - 222 | Request Title - Feature: Blocking | Request Description - Blocking by user-specified phone number, via something like an email filter rule where the messages from the number are deleted upon receipt and no notification is given.", "units": [{"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must let the user block a user-specified phone number.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must let the user block a user-specified \"phone number\".", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must allow the user to block any \"phone number\" that the user specifies."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the App receives a message from a \"blocked number\", then the App must delete the message.", "<MISSING_SCOPE>, when the user receives a message from a blocked number, then the App must delete it.", "<MISSING_SCOPE>, when a message arrives from a \"blocked number\", then the App must remove that message."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the App receives a message from a \"blocked number\", then the App must not show a \"notification\".", "<MISSING_SCOPE>, when the user receives a message from a blocked number, then the App must not show a notification.", "<MISSING_SCOPE>, when a message arrives from a \"blocked number\", then the App must not display any \"notification\" for it."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "1065-Signal": {"nl": "Request Number - 1065 | Request Title - Ask for desired behaviour on first start | Request Description - Would it be possible to ask the user during the first start of the app (right before/after setting the passphrase), to specify the desired behaviour:  only use push use SMS fallback use as default SMS/MMS-App Probably even add a \"what does that mean?\" button which opens a pop-up that explains (in simple words) what every mode does. This would go a long way in making the app more friendly for the less tech-enthusiastic users and those, who don't want to crawl through the settings-menu. edit: corrected formatting.", "units": [{"humans": ["<MISSING_SCOPE>, when the user starts the App for the first time, then the App must ask the user to choose between \"only use push\" / \"use SMS fallback\" / \"use as default SMS/MMS app\".", "<MISSING_SCOPE>, when the user starts the App for the first time, then the App must provide the user a choice between \"only use push\" / \"use SMS fallback\" / \"use as default SMS/MMS app\".", "<MISSING_SCOPE>, when the user starts the App for the first time, then the App must allow the user to choose between \"only use push\" / \"use SMS fallback\" / \"use as default SMS/MMS app\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the user presses the \"what does that mean?\" button, then the App must show a \"pop-up\" that explains each mode.", "<MISSING_SCOPE>, when the user taps the what does that mean? button, then the App must open a pop-up describing every mode.", "<MISSING_SCOPE>, when the user presses the \"what does that mean?\" button, then the App must explain each mode in a \"pop-up\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "328-Signal": {"nl": "Request Number - 328 | Request Title - Feature request: Sending dummy short messages | Request Description - TextSecure could mask meaningful communication between people by occasionally sending dummy random messages to random recipients at random times:  Recipients would be chosen randomly between contacts that knowingly use TextSecure, so it could be recognized as such after decryption and automatically discarded by recipient. \"Randomness\" should be tweaked to level-out the legitimate messages, spoiling the traffic analysis of traffic retention data, preventing to weigh connections in the deducted social network graph or guessing sleeping/activity patterns. People often have many unused messages in their monthly quota, so those could easily be used with no extra cost, or they value their privacy more than some money. Sender would need to enable this feature (opt-in) and define desired quantity (eg max 100 dummy messages per month, 2 dummy messages for every legitimate one, max 500 messages total counting legitimate and dummy ones...). The feature would need to be aware of roaming (disabled by default, optionally enable) and battery level (do not send if bellow eg. 30%). http://en.wikipedia.org/wiki/Traffic_analysis#Countermeasures Possible extensions:  Recipients could be able to let their peers know, that they do not want to participate in this and do not want to receive messages for whatever reason (opt-out). Recipients could also be chosen randomly between other contacts (those not using TextSecure yet) to promote its use (default message) or a custom explanation by sender. Those messages would be in clear text. As this might be annoying it should be very limited (eg max 1 message to a single recipient per month, only during daytime...) to not be too intrusive spam. Dummy messages could contain other peer's phone numbers (random selection from those participating in dummy messaging, not just their contacts), never to be shown to user, just to send dummy messages to, to further mask the real social network. It would be tricky to opt-out later on once your number starts circulating, so opt-outs would need to be spread this way as well and by direct reply dummy message or by defining a TTL of each such number.", "units": [{"humans": ["<MISSING_SCOPE>, if the user has enabled \"dummy messaging\", then the App must send \"dummy messages\" to random TextSecure contacts at random times.", "<MISSING_SCOPE>, if the user has switched on dummy messaging, then the App must send dummy messages to randomly chosen TextSecure contacts at random intervals.", "<MISSING_SCOPE>, if the user activates \"dummy messaging\", then the System must periodically send \"dummy messages\" at random moments to random \"TextSecure contacts\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the App receives a \"dummy message\", then the App must discard it automatically.", "<MISSING_SCOPE>, when the App receives a dummy message, then the App must automatically throw it away.", "<MISSING_SCOPE>, when a \"dummy message\" arrives, then the System must silently drop it."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must let the user define the quantity of \"dummy messages\".", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must allow the user to set how many dummy messages are sent.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the System must let the user configure the number of \"dummy messages\"."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, if the device is \"roaming\", then the App must not send \"dummy messages\" unless the user has enabled it.", "<MISSING_SCOPE>, if the phone is roaming and the user has not allowed it, then the App must stop sending dummy messages.", "<MISSING_SCOPE>, if the device is \"roaming\" and the user has not turned on \"dummy messages\" for roaming, then the System must not send any \"dummy messages\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, if the \"battery level\" is below a \"threshold\", then the App must not send \"dummy messages\".", "<MISSING_SCOPE>, if the battery drops below a threshold, then the App must stop sending dummy messages.", "<MISSING_SCOPE>, if the \"battery level\" falls under a set \"threshold\", then the System must not send \"dummy messages\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "6111-Signal": {"nl": "Request Number - 6111 | Request Title - Wishlist: Possibility to delete images in gallery mode (and when opened) | Request Description - I have:   searched open and closed issues for duplicates  read https://github.com/WhisperSystems/Signal-Android/wiki/Submitting-useful-bug-reports  Feature description. When opening \"Image gallery\" (or lateron media gallery due to #5941 ) I would like to be able to multiselect images/media and delete them. And when opening an image/media, I would like to have the possibility to delete it in this opened view. Maybe putting this option behind a settings menu as the action bar already contains forward, save, All Images. (In Gallery mode only save). IMO there should be a dialog, if you really want to delete this (all the selected images).  One point to think about is the corresponding messaged (text). At the moment, it's only possible to delete the whole messagte (text + image/media) by selecting it right in the conversation. When deleting in the gallery mode or when opened, the corresponding text is not visible to the user, so maybe it should be contained (with a hint to the deleted image/media)? [Edit: Duplicate of #4242 ]", "units": [{"humans": ["<MISSING_SCOPE>, when the user opens the \"image gallery\", then the App must let the user select multiple \"images/media\" and delete them.", "<MISSING_SCOPE>, when the user is in the gallery, then the App must allow the user to pick several images or media files and delete them.", "<MISSING_SCOPE>, when the user views the \"image gallery\", then the App must let the user multi-select \"images/media\" and remove them."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the user opens an \"image/media\", then the App must let the user delete it.", "<MISSING_SCOPE>, when the user has an image or media file open, then the App must allow the user to delete it.", "<MISSING_SCOPE>, when the user views a single \"image/media\", then the App must provide a delete option for it."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the user deletes \"images/media\", then the App must show a \"confirmation dialog\".", "<MISSING_SCOPE>, when the user deletes images or media, then the App must ask the user to confirm.", "<MISSING_SCOPE>, when the user removes \"images/media\", then the App must display a \"confirmation dialog\" first."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "226-Signal": {"nl": "Request Number - 226 | Request Title - Ability to edit messages for security | Request Description - My understanding of OTR protocol is that you are guarantied to be the sender of a message when it is received but the protocol also guaranties that nobody can prove a message was sent by you at a later point. Like a real life conversation. \"If know you said something to me, but I can not prove it at a later point\". This is great but unless TextSecure somehow allows people to alter the past of a conversation the app itself does provide a reasonable proof/indication that I said something in the past. Example: My friends phone is ceased and he is compromised to unlock TextSecure. OTR does not in any way guarantee I had our long conversation but since my friend is not a skilled hacker/developer able to alter the TextSecure database the conversation itself it a pretty good indicator/proof of the conversation being authentic. Solution: Add the option to edit a message (any message) from the Android Context Menu just like you can delete a message. Maybe also add the ability to insert a new message next to it.", "units": [{"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must let the user edit any message from the \"Android context menu\".", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must allow the user to edit any message through the Android context menu.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the System must let the user modify any message via the \"Android context menu\"."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must let the user insert a new message next to an existing message.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must allow the user to add a new message next to an existing one.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the System must let the user insert a message beside any existing message."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "4821-Signal": {"nl": "Request Number - 4821 | Request Title - Manual read receipts | Request Description - I am aware of your view on (automatic) read receipts from #2667 . That's what e.g. WhatsApp does with its blue checkmarks. However I would like to use \"manual read receipts\" in the manner Threema has implemented them (they call it \"acknowledge\"): Long-press a received message Select \"acknowledge message\" (I guess so, I use the german translation) Then the \"received\" (or \"seen\") indicator is replaced by an indicator for acknowledgement of the message I choose this to say that I read something over writing \"Ok.\" because it doesn't annoy my conversation partner. Most of the time it's sufficient that the partner gets this information the next time he opens Signal and not immediately.", "units": [{"humans": ["<MISSING_SCOPE>, when the user long-presses a \"received message\", then the App must offer an \"acknowledge message\" option.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must let the user acknowledge a received message.", "<MISSING_SCOPE>, when the user long-presses a \"received message\", then the System must show an option to \"acknowledge\" that message."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the user selects \"acknowledge message\" after long-pressing a \"received message\", then the App must replace the \"received or seen indicator\" with an \"indicator for acknowledgement\".", "<MISSING_SCOPE>, when the user selects \"acknowledge message\", then the App must replace the \"received\" indicator with an \"acknowledgement\" indicator.", "<MISSING_SCOPE>, when the user chooses \"acknowledge message\", then the System must change the \"received\" indicator to an \"acknowledged\" indicator."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "6362-Signal": {"nl": "Request Number - 6362 | Request Title - Visual display for how many contacts are on Signal | Request Description - I have:   searched open and closed issues for duplicates  read https://github.com/WhisperSystems/Signal-Android/wiki/Submitting-useful-bug-reports  It'd be nice if Signal had a screen that would show e.g. a pie chart that indicated how many of my contacts were on Signal. Or how many of the messages I send are encrypted. Tapping an element of the pie chart would then show a list of people in that category - this would be a nice way to get an overview of contacts I still need to convince to convert. There's probably also room for some gamification in here - the app could display something like e.g. \"Almost there! __\" when most, but not all, of my contacts were using Signal.", "units": [{"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must show a \"pie chart\" of how many of the user's contacts are on Signal.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must display a pie chart of the share of the user's contacts that use Signal.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the System must present a \"pie chart\" showing how many of the user's contacts have Signal."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, <MISSING_CONDITION>, the App must show how many of the user's sent messages are encrypted.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must display how many of the messages the user sent were encrypted.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the System must report the number of the user's sent messages that are encrypted."], "slots": {"scope": "missing", "condition": "missing", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the user taps an element of the \"pie chart\", then the App must show the list of people in that category.", "<MISSING_SCOPE>, when the user taps a slice of the pie chart, then the App must list the people in that slice.", "<MISSING_SCOPE>, when the user selects a segment of the \"pie chart\", then the System must display the people that belong to that segment."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, if most but not all of the user's contacts use Signal, then the App must display a \"progress message\" such as \"Almost there!\".", "<MISSING_SCOPE>, if almost all of the user's contacts are on Signal, then the App must show an encouraging message like Almost there!.", "<MISSING_SCOPE>, if most of the user's contacts but not all of them use Signal, then the System must show a \"progress message\", for example \"Almost there!\"."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}]}, "6424-Signal": {"nl": "Request Number - 6424 | Request Title - Improve search for non-contacts | Request Description - We recently made some improvements in Signal-iOS around searching for non-contacts by phone number.  I suggest we have parity on Android.  Fix non-contact lookup for non-US users.¬†SignalServiceKit#130 Further refinements to phone number parsing.¬†SignalServiceKit#139 Let's say user has a US phone number like +12045002827.  They should be able to search for another US phone number like +17043264096 by entering any of:  +17043264096 17043264096 7043264096 They should also be able to search for a non-US phone number like +441733530267 by entering any of:  +441733530267 441733530267 IMO we should try prepending the calling code for the current user's phone number and the calling code that corresponds to the default region for the current device.  I'm not sure how this works on Android, but on iOS users specify their language and region preferences as a system setting.  So for a user living in the US (With a US phone number) but who is Scottish and like seeing dates and times, etc. formatted in UK way and thus uses the UK region, we should try both US and UK calling codes since they are likely to look up users in both places.", "units": [{"humans": ["<MISSING_SCOPE>, when the user searches for a non-contact by \"phone number\" whether it has the \"+\" prefix, the \"calling code\" or neither, then the App must find the number.", "<MISSING_SCOPE>, <MISSING_CONDITION>, the App must find a user by phone number whether or not the calling code is included.", "<MISSING_SCOPE>, when the user searches for a non-contact by \"phone number\" whether it has the \"+\" prefix, the \"calling code\" or none of those, then the App must find the number."], "slots": {"scope": "missing", "condition": "present", "actor": "implied", "modalVerb": "implied", "action": "present"}, "overall": false}, {"humans": ["<MISSING_SCOPE>, when the user searches by a \"phone number\" without a \"calling code\", then the App must try the \"calling code\" of the us OPE>, when the App imports messages from an \".xml backup\", then the App must restore the \"blocked\" flag of the imported conversations.\n<\/rimay>", "format": {"block": true, "closed": true, "before": 0, "outside": 0, "dropped": [], "lines": 2}, "stop": "end_turn", "outTok": 308, "latency": 5402, "anomalies": []}, "opus/cot": {"expected": 2, "returned": 2, "mapping": {"1": 1, "2": 2}, "missing": [], "cos": {"1": 0.8417482776828793, "2": 0.8546078518132036}, "units": [{"rimay": "For each message in the \".xml backup\", <MISSING_CONDITION>, <MISSING_ACTOR> <MISSING_MODAL_VERB> include the \"archived\" flag and the \"blocked\" flag of the message in the \".xml backup\".", "slots": {"scope": "filled", "condition": "missing", "actor": "missing", "modalVerb": "missing", "action": "filled"}, "paska": false, "smells": ["Incomplete requirement", "Not requirement"], "nonAtomic": false}, {"rimay": "For each message in the \".xml backup\", after the user imports messages from the \".xml backup\", then <MISSING_ACTOR> <MISSING_MODAL_VERB> restore the \"archived\" flag and the \"blocked\" flag of the imported message.", "slots": {"scope": "filled", "condition": "filled", "actor": "missing", "modalVerb": "missing", "action": "filled"}, "paska": false, "smells": ["Incomplete requirement"], "nonAtomic": false}], "raw": "<rimay>\nFor each message in the \".xml backup\", <MISSING_CONDITION>, <MISSING_ACTOR> <MISSING_MODAL_VERB> include the \"archived\" flag and the \"blocked\" flag of the message in the \".xml backup\".\nFor each message in the \".xml backup\", after the user imports messages from the \".xml backup\", then <MISSING_ACTOR> <MISSING_MODAL_VERB> restore the \"archived\" flag and the \"blocked\" flag of the imported message.\n<\/rimay>", "format": {"block": true, "closed": true, "before": 0, "outside": 0, "dropped": [], "lines": 2}, "stop": "end_turn", "outTok": 807, "latency": 9832, "anomalies": []}}}};
const MODELS = ["haiku", "sonnet", "opus"], STRATS = ["zsl", "fsl", "cot"];
const SLOTS = ["scope", "condition", "actor", "modalVerb", "action"], REQD = new Set(["actor", "modalVerb", "action"]);
const SL = {scope: "scope", condition: "condition", actor: "actor", modalVerb: "modal verb", action: "action"};
const ML = {haiku: "Haiku", sonnet: "Sonnet", opus: "Opus"};
const COUNT_KINDS = new Set(["split_atomic", "merged_non_atomic", "count_mismatch"]);
const KINDS = Object.assign({}, ...D.runs.map(r => r.kinds));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const f2 = v => v == null ? "—" : (+v).toFixed(2);
const sw = m => `<span class="sw" style="background:var(--m-${m})"></span>`;
const runName = k => { const [m, s] = k.split("/"); return `${ML[m]} ${s}`; };
const ids = Object.keys(D.reqs);
const st = {models: new Set(MODELS), strats: new Set(STRATS), show: "count", q: ""};
try { Object.assign(st, (j => ({show: j.show || "count"}))(JSON.parse(localStorage.getItem("anomView") || "{}"))); } catch (e) {}
const runs = () => D.runs.filter(r => st.models.has(r.model) && st.strats.has(r.strat));
const cell = (id, k) => (D.cells[id] || {})[k];
const fmtIssue = c => c.anomalies.some(a => !COUNT_KINDS.has(a.kind));
const offCount = c => c.returned !== c.expected;

// ---------- filters ----------
const SHOW = [["count", "Unit count off the gold"], ["any", "Any anomaly"], ["format", "Format anomalies"], ["merged", "Gold units left unmatched"],
  ["nonatomic", "Non-atomic requirements"], ["all", "All requirements"]];
function keep(id) {
  const g = D.reqs[id], cs = runs().map(r => cell(id, r.key)).filter(Boolean);
  const hit = {count: cs.some(offCount), any: cs.some(c => c.anomalies.length), format: cs.some(fmtIssue),
    merged: cs.some(c => c.missing.length), nonatomic: g.units.length > 1, all: true}[st.show];
  return hit && (!st.q || (id + " " + g.nl).toLowerCase().includes(st.q));
}
const severity = id => runs().reduce((s, r) => { const c = cell(id, r.key); return s + (c ? (offCount(c) ? 2 : 0) + c.anomalies.length : 0); }, 0);
const visible = () => ids.filter(keep).sort((a, b) => severity(b) - severity(a) || a.localeCompare(b));

function drawFilters() {
  const chips = (host, all, set, lab) => { $(host).querySelectorAll("button").forEach(b => b.remove());
    all.forEach(v => { const b = document.createElement("button"); b.className = "fb" + (set.has(v) ? " on" : ""); b.innerHTML = lab(v);
      b.onclick = e => { if (e.altKey || e.metaKey) { set.clear(); set.add(v); } else if (set.has(v) && set.size > 1) set.delete(v); else set.add(v); render(); };
      b.title = "Click to toggle; ⌥/⌘-click to show only this"; $(host).appendChild(b); }); };
  chips("#fModel", MODELS, st.models, m => `${sw(m)} ${ML[m]}`);
  chips("#fStrat", STRATS, st.strats, s => s);
  $("#fShow").innerHTML = SHOW.map(([k, l]) => `<option value="${k}" ${st.show === k ? "selected" : ""}>${l}</option>`).join("");
}
$("#fShow").onchange = e => { st.show = e.target.value; try { localStorage.setItem("anomView", JSON.stringify({show: st.show})); } catch (_) {} render(); };
$("#fQ").oninput = e => { st.q = e.target.value.toLowerCase().trim(); render(); };

// ---------- list ----------
function strip(id) {
  return `<div class="strip">${D.runs.map(r => { const c = cell(id, r.key); if (!c) return `<i class="off">·</i>`;
    const on = st.models.has(r.model) && st.strats.has(r.strat);
    const cls = [c.returned > c.expected ? "over" : c.returned < c.expected ? "under" : "", fmtIssue(c) ? "fmt" : "", on ? "" : "off"].join(" ");
    return `<i class="${cls}" title="${esc(runName(r.key))}: ${c.returned} of ${c.expected}${c.anomalies.length ? " · " + c.anomalies.map(a => a.kind.replace(/_/g, " ")).join(", ") : ""}">${c.returned}</i>`; }).join("")}</div>`;
}
function drawList(cur) {
  const v = visible();
  $("#list").innerHTML = `<div class="li" style="cursor:default"><span class="hint">${v.length} of ${ids.length} requirements · cells: units returned per run
    (${MODELS.map(m => ML[m][0]).join("/")} × zsl·fsl·cot). <span style="color:var(--warn)">amber</span> more than gold, <span style="color:var(--bad)">red</span> fewer, blue outline = format anomaly.</span></div>`
    + v.map(id => { const g = D.reqs[id];
      return `<a class="li ${id === cur ? "on" : ""}" href="#/${encodeURIComponent(id)}"><div class="top"><span>${esc(id)}</span>
        <span class="tag ${g.units.length > 1 ? "warn" : ""}">${g.units.length > 1 ? `non-atomic · ${g.units.length}` : "atomic"}</span></div>
        <div class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.nl)}</div>${strip(id)}</a>`; }).join("");
  const on = $("#list .li.on"); if (on) on.scrollIntoView({block: "nearest"});
}

// ---------- summary ----------
function viewSummary() {
  const rs = runs(), kinds = Object.keys(KINDS).filter(k => rs.some(r => r.counts[k]));
  const n = (r, k) => r.counts[k] || 0;
  const offReq = r => ids.filter(id => { const c = cell(id, r.key); return c && offCount(c); }).length;
  const unm = r => ids.reduce((s, id) => { const c = cell(id, r.key); return s + (c ? c.missing.length : 0); }, 0);
  const goldU = ids.reduce((s, id) => s + D.reqs[id].units.length, 0);
  return `<h2>Experiment ${D.exp} — unit anomalies</h2>
    <p class="hint" style="max-width:900px">Every requirement across the ${D.runs.length} runs, built from the saved replies (nothing re-run).
      ${ids.length} requirements, ${goldU} gold units. Pick a requirement on the left, or click a number below to filter.
      A gold unit is <b>unmatched</b> when no model line was aligned to it — usually because the model merged it into another line or split the requirement differently, not because the content is absent.</p>
    <div class="card" style="overflow-x:auto"><h3>Per run</h3><table class="sum">
      <tr><th>Run</th><th class="n">units / gold</th><th class="n">requirements off-count</th><th class="n">gold units unmatched</th>
        ${kinds.map(k => `<th class="n" title="${esc(KINDS[k])}">${esc(k.replace(/_/g, " "))}</th>`).join("")}</tr>
      ${rs.map(r => { const ret = ids.reduce((s, id) => s + (cell(id, r.key) || {returned: 0}).returned, 0);
        return `<tr><td>${sw(r.model)} ${esc(runName(r.key))}</td><td class="n">${ret} / ${goldU}</td>
          <td class="c" data-only="${r.key}" data-show="count">${offReq(r)}</td><td class="c" data-only="${r.key}" data-show="merged">${unm(r)}</td>
          ${kinds.map(k => `<td class="c ${n(r, k) ? "" : "z"}" data-only="${r.key}" data-show="${COUNT_KINDS.has(k) ? "count" : "format"}">${n(r, k) || "·"}</td>`).join("")}</tr>`; }).join("")}
    </table><p class="hint" style="margin:6px 0 0">Click a cell to show only that run. Hover a header for its meaning.</p></div>
    <div class="card"><h3>What each anomaly means</h3><table style="width:auto">${Object.entries(KINDS).map(([k, v]) =>
      `<tr><td><span class="tag ${COUNT_KINDS.has(k) ? "warn" : "fmt"}">${esc(k.replace(/_/g, " "))}</span></td><td class="hint">${esc(v)}</td></tr>`).join("")}</table></div>`;
}
document.addEventListener("click", e => { const t = e.target.closest("td[data-only]"); if (!t) return;
  const [m, s] = t.dataset.only.split("/"); st.models = new Set([m]); st.strats = new Set([s]); st.show = t.dataset.show;
  const v = (render(), visible()); if (v.length) location.hash = "#/" + encodeURIComponent(v[0]); });

// ---------- requirement ----------
const words = s => new Set(String(s).toLowerCase().replace(/<missing_[a-z_]+>/g, " ").match(/[a-z0-9]+/g) || []);
const STOP = new Set("the a an to of and or for if then must shall should will be is in on by with from app signal system user it that this as when".split(" "));
function overlap(goldTexts, line) { const g = new Set([...goldTexts.flatMap(t => [...words(t)])].filter(w => !STOP.has(w))), l = [...words(line)].filter(w => !STOP.has(w));
  if (!g.size) return 0; return l.filter(w => g.has(w)).length / g.size; }
const goldSlots = s => `<span class="sl">${SLOTS.map(k => `<b class="${s[k] === "missing" ? "miss" : s[k] === "implied" ? "impl" : ""}" title="${SL[k]}: ${esc(s[k])}${REQD.has(k) ? " (required)" : " (optional)"}">${SL[k]}${REQD.has(k) ? "*" : ""}</b>`).join("")}</span>`;
const llmSlots = s => `<span class="sl">${SLOTS.map(k => `<b class="${s[k] === "missing" ? "miss" : ""}" title="${SL[k]}: ${esc(s[k])}">${SL[k]}${REQD.has(k) ? "*" : ""}</b>`).join("")}</span>`;

function rawHtml(c) {
  const raw = c.raw || "", dropped = new Set((c.format.dropped || []).map(x => x.trim()));
  if (!raw) return `<p class="hint">No reply saved.</p>`;
  const i = raw.lastIndexOf("<rimay>"), j = raw.indexOf("</rimay>", i);
  const mark = t => esc(t).split("\n").map(l => dropped.has(l.trim()) ? `<span class="drop">${l}</span>` : l).join("\n");
  if (i < 0) return `<div class="raw mono">${mark(raw)}</div>`;
  const end = j < 0 ? raw.length : j + 8;
  return `<div class="raw mono"><span class="pre">${esc(raw.slice(0, i))}</span><span class="blk">${mark(raw.slice(i, end))}</span>${esc(raw.slice(end))}</div>`;
}

function runCard(id, r) {
  const c = cell(id, r.key), g = D.reqs[id]; if (!c) return "";
  const usedBy = {}; Object.entries(c.mapping).forEach(([k, j]) => { if (j != null) usedBy[j] = +k; });
  const rows = g.units.map((u, i) => { const k = i + 1, j = c.mapping[k];
    if (j != null) { const m = c.units[j - 1] || {};
      return `<tr><td class="n">${k}</td><td class="mono">${esc(u.humans[0] || "")}</td><td class="n">${j}</td>
        <td class="mono">${esc(m.rimay)}<div style="margin-top:3px">${llmSlots(m.slots || {})} ${m.paska === false ? `<span class="tag bad" title="${esc((m.smells || []).join(", "))}">Paska fail</span>` : ""}</div></td><td class="n">${f2(c.cos[k])}</td></tr>`; }
    const best = c.units.map((m, jj) => ({jj: jj + 1, o: overlap(u.humans, m.rimay)})).sort((a, b) => b.o - a.o)[0];
    const where = best && best.o >= .35 ? `Closest model line: <b>#${best.jj}</b> (${Math.round(best.o * 100)}% of the gold unit's content words)${usedBy[best.jj] ? `, already aligned to gold #${usedBy[best.jj]} — likely <b>merged</b>` : ""}.`
      : `No model line shares most of its content — likely <b>dropped</b>.`;
    return `<tr class="gap"><td class="n">${k}</td><td class="mono">${esc(u.humans[0] || "")}</td><td class="n">—</td><td colspan="2"><b>Unmatched.</b> ${where}</td></tr>`; }).join("");
  const extras = c.units.map((m, jj) => ({m, j: jj + 1})).filter(x => !usedBy[x.j]).map(x =>
    `<tr class="extra"><td class="n">—</td><td class="hint">no gold unit — extra line</td><td class="n">${x.j}</td><td class="mono" colspan="2">${esc(x.m.rimay)}<div style="margin-top:3px">${llmSlots(x.m.slots || {})}</div></td></tr>`).join("");
  const f = c.format, bad = offCount(c) || c.anomalies.length;
  return `<div class="card" id="r-${r.key.replace("/", "-")}"><h3>${sw(r.model)} ${esc(runName(r.key))}
      <span class="tag ${c.returned === c.expected ? "ok" : c.returned > c.expected ? "warn" : "bad"}">${c.returned} of ${c.expected} units</span>
      ${c.anomalies.map(a => `<span class="tag ${COUNT_KINDS.has(a.kind) ? "warn" : "fmt"}" title="${esc(KINDS[a.kind] || "")}${a.detail ? " — " + esc(a.detail) : ""}">${esc(a.kind.replace(/_/g, " "))}</span>`).join("")}</h3>
    <div style="overflow-x:auto"><table><tr><th class="n">gold</th><th>Gold unit (annotator 1)</th><th class="n">model</th><th>Model line</th><th class="n">cosine</th></tr>${rows}${extras}</table></div>
    <details ${bad ? "open" : ""} style="margin-top:8px"><summary class="hint">Full reply · stop ${esc(c.stop || "—")} · ${c.outTok ?? "—"} output tokens · ${c.latency != null ? (c.latency / 1000).toFixed(1) + " s" : "—"}
      · block ${f.block ? (f.closed ? "closed" : "<b>unclosed</b>") : "<b>none</b>"} · ${f.before || 0} chars before, ${f.outside || 0} after${(f.dropped || []).length ? ` · ${f.dropped.length} dropped lines` : ""}</summary>
      <div style="margin-top:6px">${rawHtml(c)}</div>
      <p class="hint" style="margin:4px 0 0">Green = the parsed <code>&lt;rimay&gt;</code> block; grey = text before it; struck red = lines removed by the Rimay-line filter.</p></details></div>`;
}

function viewReq(id) {
  const g = D.reqs[id]; if (!g) return `<div class="card">Unknown requirement ${esc(id)}.</div>`;
  const v = visible(), i = v.indexOf(id);
  const nav = `<span class="hint">${i >= 0 ? `${i + 1} of ${v.length}` : "not in the current filter"}
    ${i > 0 ? ` · <a href="#/${encodeURIComponent(v[i - 1])}">← ${esc(v[i - 1])}</a>` : ""}${i >= 0 && i < v.length - 1 ? ` · <a href="#/${encodeURIComponent(v[i + 1])}">${esc(v[i + 1])} →</a>` : ""}</span>`;
  const rs = runs();
  return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>${esc(id)}
      <span class="tag ${g.units.length > 1 ? "warn" : ""}">${g.units.length > 1 ? `non-atomic · ${g.units.length} gold units` : "atomic · 1 gold unit"}</span></h2>${nav}</div>
    <div class="card" style="margin-top:8px"><h3>Source</h3><div class="mono">${esc(g.nl)}</div></div>
    <details class="card"><summary><b>Gold units</b> <span class="hint">— all three annotators; slots: <span class="sl"><b class="miss">missing</b><b class="impl">implied</b><b>present</b></span>, * = required by the Rimay grammar</span></summary>
      <table style="margin-top:6px"><tr><th class="n">#</th><th>Annotators' Rimay</th><th>Gold slots</th></tr>
      ${g.units.map((u, k) => `<tr><td class="n">${k + 1}</td><td>${u.humans.map(h => `<div class="mono">• ${esc(h)}</div>`).join("")}</td><td>${goldSlots(u.slots)}</td></tr>`).join("")}</table></details>
    <div class="card"><h3>Units returned per run</h3><table style="width:auto"><tr><th></th>${STRATS.map(s => `<th class="n">${s}</th>`).join("")}</tr>
      ${MODELS.map(m => `<tr><td>${sw(m)} ${ML[m]}</td>${STRATS.map(s => { const c = cell(id, `${m}/${s}`); if (!c) return `<td class="n hint">·</td>`;
        const col = c.returned > c.expected ? "var(--warn)" : c.returned < c.expected ? "var(--bad)" : "var(--muted)";
        return `<td class="n"><a href="#r-${m}-${s}" style="color:${col};font-weight:${c.returned === c.expected ? 400 : 700}" onclick="event.preventDefault();document.getElementById('r-${m}-${s}')?.scrollIntoView({behavior:'smooth'})">${c.returned}</a></td>`; }).join("")}</tr>`).join("")}
    </table><p class="hint" style="margin:4px 0 0">Gold: ${g.units.length}. Click a number to jump to that run.</p></div>
    ${rs.map(r => runCard(id, r)).join("") || `<p class="hint">No run matches the model / strategy filter.</p>`}`;
}

// ---------- routing ----------
function render() {
  drawFilters();
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const real = D.reqs[id] ? id : "";
  drawList(real);
  $("#main").innerHTML = real ? viewReq(real) : viewSummary();
  document.title = real ? `${real} · unit anomalies` : "Unit anomalies";
}
window.addEventListener("hashchange", () => { render(); $("#main").scrollTop = 0; });
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey) return;
  const v = visible(), id = decodeURIComponent(location.hash.replace(/^#\/?/, "")), i = v.indexOf(id);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); const n = v[Math.min(v.length - 1, i + 1)]; if (n) location.hash = "#/" + encodeURIComponent(n); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); const n = v[Math.max(0, i - 1)]; if (n) location.hash = "#/" + encodeURIComponent(n); }
  if (e.key === "Escape") location.hash = "#/";
});
$("#ttl").textContent = `Experiment ${D.exp} · unit anomalies`;
render();
</script>
</body>
</html>
